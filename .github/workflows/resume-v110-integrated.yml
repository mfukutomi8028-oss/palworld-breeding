name: Resume v110 integrated build

on:
  push:
    branches: [resume-v110-integrated]

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[resume-v110-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: resume-v110-integrated
          fetch-depth: 0

      - name: Reuse the already generated PalDB fixed dataset
        run: |
          git fetch origin fix-pages-v110
          git checkout origin/fix-pages-v110 -- data/pal-stats-v1.json data/pals-v1.json
          test -s data/pal-stats-v1.json
          test -s data/pals-v1.json

      - name: Integrate the verified dataset into the existing v110 implementation
        run: |
          python scripts/apply-paldex-stats-v110.py
          node scripts/validate-pal-stats-v110.mjs
          node --check app-core.js
          node --check app-data.js
          node --check app-explore.js
          node --check app-actions.js
          grep -q '?v=110' index.html
          grep -q 'palSiteVersion = "110"' config.js

      - name: Commit only the resumed v110成果物
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/pals-v1.json data/pal-stats-v1.json data/SOURCES.md \
            app-core.js app-data.js app-explore.js app-actions.js ui-shell.js \
            style-components.css style-responsive.css index.html config.js
          git commit -m '[resume-v110-generated] Integrate verified PalDB stats into v110'
          git push origin HEAD:resume-v110-integrated
