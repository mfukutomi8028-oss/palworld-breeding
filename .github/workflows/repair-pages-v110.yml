name: Repair Pages v110

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Switch GitHub Pages to Actions deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="$(curl -sS -o /tmp/pages-update.json -w '%{http_code}' -X PUT \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/json' \
            -d '{"build_type":"workflow"}' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")"
          echo "Pages update HTTP ${status}"
          cat /tmp/pages-update.json
          test "$status" = '204' -o "$status" = '200'

      - name: Verify Pages configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" | tee /tmp/pages.json
          grep -q '"build_type": "workflow"' /tmp/pages.json
