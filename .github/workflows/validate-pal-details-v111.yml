name: Validate Pal details and UX

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-pal-details:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate source and fixed data
        run: |
          node --check app-pal-details-v111.js
          node --check app-ux-v112.js
          node --check app-ux-v113.js
          node --check app-ux-v115.js
          node --check app-ux-v116.js
          node --check app-ux-v117.js
          node --check app-ux-v118.js
          node --check app-ux-v118-work.js
          node --check app-growth-v118-data.js
          node --check app-growth-v118-ui.js
          node --check scripts/validate-pal-details-v111.mjs
          node --check scripts/validate-pal-ui-v113.mjs
          node --check scripts/validate-site-version.mjs
          node --check scripts/smoke-pal-details-v111.mjs
          node --check scripts/smoke-ux-v112.mjs
          node --check scripts/smoke-ux-v113.mjs
          node --check scripts/smoke-ux-v115.mjs
          node --check scripts/smoke-ux-v116.mjs
          node --check scripts/smoke-ux-v117.mjs
          node --check scripts/smoke-ux-v118.mjs
          python -m py_compile scripts/build-paldb-details-v111.py
          python -m py_compile scripts/build-paldb-ui-v113.py
          python -m py_compile scripts/localize-pal-ui-icons-v113.py
          test -f style-ux-v114.css
          test -f style-ux-v115.css
          test -f style-ux-v116.css
          test -f style-ux-v118.css
          node scripts/validate-pal-details-v111.mjs
          node scripts/validate-pal-ui-v113.mjs
          node scripts/validate-site-version.mjs

      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start GitHub Pages-compatible local server
        run: |
          python3 -m http.server 4173 > /tmp/pal-v118-site.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pal-v118-site.log
          exit 1

      - name: Test Pal detail UI
        env:
          APP_URL: http://127.0.0.1:4173/
        run: node scripts/smoke-pal-details-v111.mjs

      - name: Test v112 usability flows
        env:
          APP_URL: http://127.0.0.1:4173/
        run: node scripts/smoke-ux-v112.mjs

      - name: Test v114 rich Paldex flows
        env:
          APP_URL: http://127.0.0.1:4173/
        run: node scripts/smoke-ux-v113.mjs

      - name: Test v115 icon readability and profile navigation
        env:
          APP_URL: http://127.0.0.1:4173/
        run: node scripts/smoke-ux-v115.mjs

      - name: Test v116 hint, compare and version flows
        env:
          APP_URL: http://127.0.0.1:4173/
        run: node scripts/smoke-ux-v116.mjs

      - name: Test v117 egg reset flows
        env:
          APP_URL: http://127.0.0.1:4173/
        run: node scripts/smoke-ux-v117.mjs

      - name: Test v118 progression, ranks, work sorting and modal backdrop
        env:
          APP_URL: http://127.0.0.1:4173/
        run: node scripts/smoke-ux-v118.mjs
