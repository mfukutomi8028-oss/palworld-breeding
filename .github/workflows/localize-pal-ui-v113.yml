name: Localize PalDB UI icons v113

on:
  push:
    branches: [feature/paldex-rich-icons-v113]
    paths:
      - scripts/localize-pal-ui-icons-v113.py
      - .github/workflows/localize-pal-ui-v113.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  localize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/paldex-rich-icons-v113

      - name: Download verified icon snapshot
        run: python scripts/localize-pal-ui-icons-v113.py

      - name: Validate local icon references
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload=json.loads(Path('data/pal-ui-v113.json').read_text(encoding='utf-8'))
          assert payload.get('iconStorage',{}).get('mode') == 'local-snapshot'
          assert payload.get('iconStorage',{}).get('uniqueFiles',0) > 100
          refs=list(payload['elementIcons'].values())+list(payload['workIcons'].values())
          for record in payload['records']:
              refs.append(record['partnerSkill']['icon'])
              refs.extend(drop['icon'] for drop in record.get('drops',[]) if drop.get('icon'))
          assert all(not str(ref).startswith(('http://','https://')) for ref in refs)
          assert all(Path(ref).is_file() for ref in refs)
          print('Localized icon refs:', len(set(refs)))
          PY

      - name: Commit localized assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pal-ui-v113.json assets/paldb-ui-v113
          if git diff --cached --quiet; then
            echo "Localized snapshot is already current."
            exit 0
          fi
          git commit -m "[generated-v113] Store PalDB UI icons locally"
          git push origin HEAD:feature/paldex-rich-icons-v113
