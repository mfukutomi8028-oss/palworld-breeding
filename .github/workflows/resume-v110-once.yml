name: Resume v110 once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  resume:
    if: ${{ contains(github.event.head_commit.message, '[resume-v110-once]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore the already generated and verified PalDB dataset
        run: |
          git fetch origin fix-pages-v110
          git checkout origin/fix-pages-v110 -- data/pal-stats-v1.json data/pals-v1.json
          test -s data/pal-stats-v1.json
          test -s data/pals-v1.json

      - name: Continue from the interrupted integration step
        run: |
          python scripts/apply-paldex-stats-v110.py
          node scripts/validate-pal-stats-v110.mjs
          node --check app-core.js
          node --check app-data.js
          node --check app-explore.js
          node --check app-actions.js
          grep -q '?v=110' index.html
          grep -q 'palSiteVersion = "110"' config.js

      - name: Commit resumed v110 artifacts to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/pals-v1.json data/pal-stats-v1.json data/SOURCES.md \
            app-core.js app-data.js app-explore.js app-actions.js ui-shell.js \
            style-components.css style-responsive.css index.html config.js
          git commit -m '[resume-v110-complete] Integrate verified PalDB stats and v110 Paldex'
          git push origin HEAD:main
