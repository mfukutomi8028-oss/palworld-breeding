name: Probe Pal Stats v110

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe current 1.0 stat sources without external actions
        run: |
          python - <<'PY'
          import urllib.error
          import urllib.parse
          import urllib.request

          urls = [
              'https://palworld.wiki.gg/wiki/Pal_Stats',
              'https://palworld.wiki.gg/api.php?' + urllib.parse.urlencode({
                  'action': 'parse',
                  'page': 'Pal Stats',
                  'prop': 'text|wikitext',
                  'format': 'json',
                  'formatversion': '2',
              }),
              'https://paldb.cc/en/Pal_Stats',
          ]
          for index, url in enumerate(urls):
              print('\n===', url, '===')
              request = urllib.request.Request(url, headers={
                  'User-Agent': 'palworld-breeding-data-audit/1.0 (GitHub Actions)',
                  'Accept': 'text/html,application/json',
              })
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      body = response.read()
                      print('status', response.status, 'type', response.headers.get('content-type'), 'bytes', len(body))
                      text = body.decode('utf-8', errors='replace')
                      print(text[:2000])
                      open(f'/tmp/stat-source-{index}.txt', 'w', encoding='utf-8').write(text)
              except urllib.error.HTTPError as error:
                  print('HTTP', error.code, error.read().decode(errors='replace')[:2000])
              except Exception as error:
                  print(type(error).__name__, repr(error))
          PY
