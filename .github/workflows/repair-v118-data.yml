name: Repair v118 growth data

on:
  push:
    branches: [feature-paldex-growth-v118]

permissions:
  contents: write

jobs:
  repair:
    if: contains(github.event.head_commit.message, 'Rebuild active skills from PalDB text')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-paldex-growth-v118
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4
      - name: Replace active-skill parser with PalDB text-section parser
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path=Path('scripts/build-pal-growth-v118.py')
          text=path.read_text(encoding='utf-8')
          start=text.index('def parse_active_skills(soup: BeautifulSoup) -> list[dict[str, Any]]:')
          end=text.index('\ndef parse_record(record: dict[str, Any]) -> dict[str, Any]:', start)
          replacement=r'''def parse_active_skills(soup: BeautifulSoup) -> list[dict[str, Any]]:
    text = " ".join(soup.get_text(" ", strip=True).split())
    start = text.find("Active Skills")
    if start < 0:
        return []
    end_candidates = [index for label in ("Passive Skills", "Possible Drops") if (index := text.find(label, start + 1)) >= 0]
    end = min(end_candidates) if end_candidates else len(text)
    segment = text[start + len("Active Skills"):end].strip()
    if not segment:
        return []

    entries = re.split(r"(?=Lv\.\s*\d+\s+)", segment)
    skills: list[dict[str, Any]] = []
    element_pattern = "|".join(sorted((re.escape(value) for value in ELEMENTS), key=len, reverse=True))
    for entry in entries:
        entry = " ".join(entry.split()).strip()
        if not entry.startswith("Lv."):
            continue
        header = re.match(rf"^Lv\.\s*(\d+)\s+(.+?)\s+({element_pattern})\s+", entry)
        if not header:
            continue
        level = int(header.group(1))
        name = header.group(2).strip()
        element = header.group(3).strip()
        rest = entry[header.end():].strip()
        power_match = re.search(r"威力\s*[:：]\s*(\d+)", rest)
        power = int(power_match.group(1)) if power_match else None
        before_power = rest[:power_match.start()] if power_match else rest
        ct_matches = re.findall(r"(?<!\d)(\d+)(?!\d)", before_power)
        ct = int(ct_matches[-1]) if ct_matches else None
        statuses: list[dict[str, Any]] = []
        for match in re.finditer(r"蓄積値\s*[:：]\s*([^\d]+?)\s+(\d+)", rest):
            label = " ".join(match.group(1).split()).strip(" :：")
            if label:
                statuses.append({"name": label[:30], "value": int(match.group(2))})
        effects = effect_tags_from_text(rest)
        for status in statuses:
            label = f"{status['name']} {status['value']}"
            if label not in effects:
                effects.append(label)
        skills.append({
            "level": level,
            "name": name,
            "element": element,
            "ct": ct,
            "power": power,
            "effects": effects[:6],
            "exclusive": "専用スキル" in rest,
        })

    deduped: list[dict[str, Any]] = []
    seen = set()
    for skill in skills:
        key = (skill["level"], skill["name"])
        if key in seen:
            continue
        seen.add(key)
        deduped.append(skill)
    return sorted(deduped, key=lambda skill: (skill["level"], skill["name"]))

'''
          path.write_text(text[:start]+replacement+text[end+1:],encoding='utf-8')
          PY
      - name: Rebuild snapshot
        run: python scripts/build-pal-growth-v118.py
      - name: Validate representative data
        run: |
          python - <<'PY'
          import json
          data=json.load(open('data/pal-growth-v1.json',encoding='utf-8'))
          assert data['count']==299
          assert data['partnerStarCoverage']==299
          assert data['activeSkillCoverage']>=295, data['activeSkillCoverage']
          rows={r['enName']:r for r in data['records']}
          lamball=rows['Lamball']
          bylv={s['level']:s for s in lamball['activeSkills']}
          assert bylv[40]['name']=='パワーボム', bylv.get(40)
          assert bylv[40]['ct']==8 and bylv[40]['power']==120, bylv[40]
          assert bylv[50]['power']==450 and bylv[70]['power']==700
          men=rows['Menasting']
          assert len(men['partnerSkill']['stars'])==5
          assert any('40' in e for e in men['partnerSkill']['stars'][0]['effects'])
          assert any('80' in e for e in men['partnerSkill']['stars'][4]['effects'])
          assert any('5' in e for e in men['partnerSkill']['stars'][0]['effects'])
          assert any('10' in e for e in men['partnerSkill']['stars'][4]['effects'])
          men40={s['level']:s for s in men['activeSkills']}[40]
          assert men40['name']=='ロックランス' and men40['ct']==20 and men40['power']==400, men40
          print('coverage',data['partnerStarCoverage'],data['activeSkillCoverage'])
          print('Lamball Lv40',bylv[40])
          print('Menasting ★0',men['partnerSkill']['stars'][0])
          print('Menasting ★4',men['partnerSkill']['stars'][4])
          PY
      - name: Commit repaired builder and fixed data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/build-pal-growth-v118.py data/pal-growth-v1.json
          git commit -m '[v118-data] Parse PalDB active skills and add growth snapshot'
          git push origin HEAD:feature-paldex-growth-v118
