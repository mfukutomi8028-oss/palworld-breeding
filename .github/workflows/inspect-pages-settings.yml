name: Inspect GitHub Pages settings

on:
  pull_request:

permissions:
  contents: read
  pages: read

jobs:
  inspect-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Read Pages configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" | tee /tmp/pages.json
          echo
          echo "Configured source:"
          python - <<'PY'
          import json
          data=json.load(open('/tmp/pages.json',encoding='utf-8'))
          print(json.dumps({
            'html_url':data.get('html_url'),
            'status':data.get('status'),
            'build_type':data.get('build_type'),
            'source':data.get('source'),
            'public':data.get('public'),
          },ensure_ascii=False,indent=2))
          PY
