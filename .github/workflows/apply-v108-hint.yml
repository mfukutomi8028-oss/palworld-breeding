name: Apply v108 short-name hint correction

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[apply-v108-hint]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply hint correction
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:120]!r}')
              file.write_text(text.replace(old, new), encoding='utf-8')

          old_definitions = '''const HINT_POSITION_DEFINITIONS = [
            {key:"first",label:"先頭"},
            {key:"front2",label:"前から2"},
            {key:"front3",label:"前から3"},
            {key:"middle",label:"中央"},
            {key:"back3",label:"後ろから3"},
            {key:"back2",label:"後ろから2"},
            {key:"last",label:"末尾"},
          ];'''
          new_definitions = '''const HINT_POSITION_DEFINITIONS = [
            {key:"first",label:"先頭",shortLabel:"1文字目",slot:0},
            {key:"front2",label:"前から2",shortLabel:"2文字目",slot:1},
            {key:"front3",label:"前から3",shortLabel:"3文字目",slot:2},
            {key:"middle",label:"中央",shortLabel:"4文字目",slot:3},
            {key:"back3",label:"後ろから3",shortLabel:"5文字目",slot:4},
            {key:"back2",label:"後ろから2",shortLabel:"6文字目",slot:5},
            {key:"last",label:"末尾",shortLabel:"7文字目",slot:6},
          ];'''
          replace_once('app-discovery.js', old_definitions, new_definitions)

          old_position = '''function hintPositionIndex(length,key){
            const last=Math.max(0,length-1);
            if(key==="first")return 0;
            if(key==="front2")return Math.min(1,last);
            if(key==="front3")return Math.min(2,last);
            if(key==="middle")return Math.floor(last/2);
            if(key==="back3")return Math.max(0,last-2);
            if(key==="back2")return Math.max(0,last-1);
            return last;
          }

          function hintCharacterAt(value,key){
            const characters=hintCharacters(value);
            if(!characters.length)return "—";
            return characters[hintPositionIndex(characters.length,key)] || "—";
          }'''
          new_position = '''function hintPositionIndex(length,key){
            const position=HINT_POSITION_DEFINITIONS.find(item=>item.key===key);
            if(!position)return -1;
            if(length<=7)return position.slot<length?position.slot:-1;
            const last=length-1;
            if(key==="first")return 0;
            if(key==="front2")return 1;
            if(key==="front3")return 2;
            if(key==="middle")return Math.floor(last/2);
            if(key==="back3")return last-2;
            if(key==="back2")return last-1;
            return last;
          }

          function hintCharacterAt(value,key){
            const characters=hintCharacters(value),index=hintPositionIndex(characters.length,key);
            return index>=0&&index<characters.length?characters[index]:"×";
          }'''
          replace_once('app-discovery.js', old_position, new_position)

          old_panel = '''function positionHintPanel(type,title,value,revealed,scope,candidateId=""){
            const selected=new Set(Array.isArray(revealed)?revealed:[]);
            const buttons=HINT_POSITION_DEFINITIONS.map(position=>{
              const isRevealed=selected.has(position.key);
              const attribute=scope==="reverse"
                ? `data-reverse-position="${escapeHtml(candidateId)}|${type}|${position.key}"`
                : `data-forward-position="${type}|${position.key}"`;
              return `<button class="hint-position${isRevealed?" is-revealed":""}" type="button" ${attribute} ${isRevealed?"disabled":""}><span>${position.label}</span><strong>${isRevealed?escapeHtml(hintCharacterAt(value,position.key)):"?"}</strong></button>`;
            }).join("");
            return `<section class="hint-letter-panel"><div class="hint-letter-panel__heading"><strong>${title}</strong><span>開きたい場所を選択・文字数は非表示</span></div><div class="hint-position-grid">${buttons}</div></section>`;
          }'''
          new_panel = '''function positionHintPanel(type,title,value,revealed,scope,candidateId=""){
            const selected=new Set(Array.isArray(revealed)?revealed:[]),characters=hintCharacters(value),sequential=characters.length<=7;
            const buttons=HINT_POSITION_DEFINITIONS.map(position=>{
              const unavailable=hintPositionIndex(characters.length,position.key)<0,isRevealed=selected.has(position.key),visible=isRevealed||unavailable;
              const attribute=scope==="reverse"
                ? `data-reverse-position="${escapeHtml(candidateId)}|${type}|${position.key}"`
                : `data-forward-position="${type}|${position.key}"`;
              return `<button class="hint-position${visible?" is-revealed":""}${unavailable?" is-unavailable":""}" type="button" ${attribute} ${visible?"disabled":""}><span>${sequential?position.shortLabel:position.label}</span><strong>${visible?escapeHtml(unavailable?"×":hintCharacterAt(value,position.key)):"?"}</strong></button>`;
            }).join("");
            return `<section class="hint-letter-panel"><div class="hint-letter-panel__heading"><strong>${title}</strong><span>${sequential?"開きたい文字を選択・名前のない位置は×":"開きたい場所を選択・文字数は非表示"}</span></div><div class="hint-position-grid">${buttons}</div></section>`;
          }'''
          replace_once('app-discovery.js', old_panel, new_panel)

          replace_once(
              'app-discovery.js',
              '英語名・日本語名は固定された7か所から選んで1文字ずつ開きます。名前の文字数は表示しません。',
              '7文字以下の名前は先頭から順に表示し、存在しない位置は×になります。8文字以上は先頭・中央・末尾付近から表示します。'
          )

          index = Path('index.html')
          index.write_text(index.read_text(encoding='utf-8').replace('?v=107','?v=108'), encoding='utf-8')
          replace_once('config.js','window.palSiteVersion = "107";','window.palSiteVersion = "108";')

          smoke = '''import { chromium } from "playwright";

          const baseUrl = process.env.APP_URL || "http://127.0.0.1:4173/";
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 1440, height: 1000 } });
          const page = await context.newPage();
          const room = `ci-v108-hint-${Date.now()}`;
          await page.addInitScript(roomId => {
            localStorage.setItem(`pal-breeding-current-user:${roomId}`, "福冨");
            localStorage.setItem("palBoardRecorder", "福冨");
          }, room);
          await page.goto(`${baseUrl}#room=${room}`, { waitUntil: "domcontentloaded", timeout: 60000 });
          await page.waitForFunction(() => document.querySelector("#app")?.dataset.ready === "true", null, { timeout: 60000 });
          await page.waitForFunction(() => document.querySelector("#bootScreen")?.classList.contains("is-hidden"), null, { timeout: 10000 });

          const audit = await page.evaluate(() => {
            const short = HINT_POSITION_DEFINITIONS.map(position => hintCharacterAt("ムラクモ", position.key));
            const long = HINT_POSITION_DEFINITIONS.map(position => hintCharacterAt("Fenglope", position.key));
            const host = document.createElement("div");
            host.innerHTML = positionHintPanel("japanese", "ヒント4・日本語名", "ムラクモ", [], "forward");
            const buttons = Array.from(host.querySelectorAll(".hint-position")).map(button => ({
              label: button.querySelector("span")?.textContent || "",
              value: button.querySelector("strong")?.textContent || "",
              disabled: button.disabled,
              unavailable: button.classList.contains("is-unavailable"),
            }));
            return { short, long, buttons };
          });

          const expectedShort = ["ム", "ラ", "ク", "モ", "×", "×", "×"];
          const expectedLong = ["F", "e", "n", "g", "o", "p", "e"];
          if (JSON.stringify(audit.short) !== JSON.stringify(expectedShort)) throw new Error(`Short Japanese hint is incorrect: ${JSON.stringify(audit)}`);
          if (JSON.stringify(audit.long) !== JSON.stringify(expectedLong)) throw new Error(`Long English positional hint regressed: ${JSON.stringify(audit)}`);
          if (audit.buttons.map(button => button.label).join("|") !== "1文字目|2文字目|3文字目|4文字目|5文字目|6文字目|7文字目") throw new Error(`Short-name labels are incorrect: ${JSON.stringify(audit.buttons)}`);
          if (!audit.buttons.slice(0, 4).every(button => button.value === "?" && !button.disabled && !button.unavailable)) throw new Error(`Available short-name cards are incorrect: ${JSON.stringify(audit.buttons)}`);
          if (!audit.buttons.slice(4).every(button => button.value === "×" && button.disabled && button.unavailable)) throw new Error(`Unused short-name cards are incorrect: ${JSON.stringify(audit.buttons)}`);

          await context.close();
          await browser.close();
          console.log("v108 hint smoke test passed: ムラクモ / × padding / long-name positional hints.");
          '''
          Path('scripts/smoke-v108-hint.mjs').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in smoke.splitlines()) + '\n', encoding='utf-8')

          validate = Path('.github/workflows/validate.yml')
          text = validate.read_text(encoding='utf-8')
          text = text.replace('node --check scripts/smoke-v107.mjs', 'node --check scripts/smoke-v107.mjs\n          node --check scripts/smoke-v108-hint.mjs')
          text = text.replace("assert '?v=107' in html, 'v107 cache busting is missing'", "assert '?v=108' in html, 'v108 cache busting is missing'")
          text = text.replace('node scripts/smoke-v107.mjs', 'node scripts/smoke-v107.mjs\n          node scripts/smoke-v108-hint.mjs')
          text = text.replace('Wait for GitHub Pages v107 deployment', 'Wait for GitHub Pages v108 deployment')
          text = text.replace("grep -q 'app-discovery.js?v=107'", "grep -q 'app-discovery.js?v=108'")
          text = text.replace('GitHub Pages did not publish v107 within the expected time.', 'GitHub Pages did not publish v108 within the expected time.')
          validate.write_text(text, encoding='utf-8')
          PY

      - name: Commit v108 changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-discovery.js index.html config.js scripts/smoke-v108-hint.mjs .github/workflows/validate.yml
          git commit -m "Fix short-name hint positions v108"
          git push origin HEAD:main
