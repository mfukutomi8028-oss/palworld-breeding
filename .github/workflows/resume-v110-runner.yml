name: Resume v110 integration runner

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ contains(github.event.head_commit.message, '[run-resume-v110]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm the existing fixed dataset is present
        run: |
          test -s data/pal-stats-v1.json
          test -s data/pals-v1.json

      - name: Apply only the unfinished v110 UI integration
        run: |
          python scripts/apply-paldex-stats-v110.py
          node scripts/validate-pal-stats-v110.mjs
          node --check app-core.js
          node --check app-data.js
          node --check app-explore.js
          node --check app-actions.js
          grep -q '?v=110' index.html
          grep -q 'palSiteVersion = "110"' config.js

      - name: Commit the completed v110 integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/pals-v1.json data/pal-stats-v1.json data/SOURCES.md \
            app-core.js app-data.js app-explore.js app-actions.js ui-shell.js \
            style-components.css style-responsive.css index.html config.js
          git commit -m '[pal-stats-v110] Complete verified stats and Paldex integration'
          git push origin HEAD:main

