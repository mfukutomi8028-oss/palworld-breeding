name: Generate PalDB UI snapshot v114

on:
  push:
    branches: [feature/paldex-drop-conditions-v114]
    paths:
      - scripts/build-paldb-ui-v113.py
      - scripts/localize-pal-ui-icons-v113.py
      - .github/workflows/generate-pal-ui-v114.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/paldex-drop-conditions-v114

      - name: Install parser dependency
        run: python -m pip install --disable-pip-version-check beautifulsoup4==4.13.4

      - name: Build current PalDB UI snapshot
        run: python scripts/build-paldb-ui-v113.py --workers 4

      - name: Localize PalDB icons and condition markers
        run: python scripts/localize-pal-ui-icons-v113.py

      - name: Validate regenerated snapshot
        run: |
          node scripts/validate-pal-ui-v113.mjs
          python - <<'PY'
          import json
          from pathlib import Path
          payload=json.loads(Path('data/pal-ui-v113.json').read_text(encoding='utf-8'))
          lyleen=next(item for item in payload['records'] if item['name']=='Lyleen')
          print('Lyleen drops:', len(lyleen['drops']))
          for row in lyleen['drops']:
              print(row['item'], row['quantity'], row.get('level',''), row.get('isBoss',False), row.get('conditionIcon',''), row['probability'])
          PY

      - name: Commit regenerated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pal-ui-v113.json assets/paldb-ui-v113
          if git diff --cached --quiet; then
            echo "Snapshot is already current."
            exit 0
          fi
          git commit -m "[generated-v114] Refresh structured PalDB drop data"
          git push origin HEAD:feature/paldex-drop-conditions-v114
