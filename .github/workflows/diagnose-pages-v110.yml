name: Diagnose Pages v110

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect repository main without external actions
        run: |
          base='https://raw.githubusercontent.com/mfukutomi8028-oss/palworld-breeding/main'
          curl -fsSL "${base}/index.html?sha=${GITHUB_SHA}" -o /tmp/main-index.html
          curl -fsSL "${base}/config.js?sha=${GITHUB_SHA}" -o /tmp/main-config.js
          echo '--- main index.html version refs ---'
          grep -oE '\?v=[0-9]+' /tmp/main-index.html | sort -u
          echo '--- main config.js site version ---'
          grep 'palSiteVersion' /tmp/main-config.js

      - name: Inspect GitHub Pages configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="$(curl -sS -o /tmp/pages.json -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")"
          echo "Pages API HTTP ${status}"
          cat /tmp/pages.json
          test "$status" = '200'

      - name: Inspect recent Pages build failures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def get_json(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          runs = get_json(f'https://api.github.com/repos/{repo}/actions/runs?per_page=100').get('workflow_runs', [])
          pages_runs = [run for run in runs if run.get('name') == 'pages build and deployment']
          print('Recent legacy Pages runs:')
          for run in pages_runs[:10]:
              print(json.dumps({
                  'id': run.get('id'),
                  'head_sha': run.get('head_sha'),
                  'status': run.get('status'),
                  'conclusion': run.get('conclusion'),
                  'created_at': run.get('created_at'),
                  'html_url': run.get('html_url'),
              }, ensure_ascii=False))

          failed = next((run for run in pages_runs if run.get('conclusion') == 'failure'), None)
          if not failed:
              print('No failed legacy Pages run found in the latest 100 runs.')
              raise SystemExit(0)

          jobs = get_json(f"https://api.github.com/repos/{repo}/actions/runs/{failed['id']}/jobs?per_page=100").get('jobs', [])
          print(f"Inspecting failed Pages run {failed['id']}")
          for job in jobs:
              print(json.dumps({
                  'job_id': job.get('id'),
                  'name': job.get('name'),
                  'status': job.get('status'),
                  'conclusion': job.get('conclusion'),
                  'steps': [{
                      'name': step.get('name'),
                      'conclusion': step.get('conclusion'),
                  } for step in job.get('steps', [])],
              }, ensure_ascii=False))
              if job.get('conclusion') != 'failure':
                  continue
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/actions/jobs/{job['id']}/logs",
                  headers=headers,
              )
              with urllib.request.urlopen(req) as response:
                  text = response.read().decode('utf-8', errors='replace')
              important = [line for line in text.splitlines() if any(word in line.lower() for word in ('error', 'failed', 'jekyll', 'pages', 'artifact'))]
              print('\n'.join(important[-120:]))
          PY

      - name: Inspect published files without browser cache
        run: |
          base='https://mfukutomi8028-oss.github.io/palworld-breeding'
          stamp="${GITHUB_SHA}-$(date +%s)"
          for path in index.html config.js app-discovery.js; do
            safe="${path//\//_}"
            echo "--- published ${path} ---"
            curl -fsSL -D "/tmp/${safe}.headers" "${base}/${path}?diagnostic=${stamp}" -o "/tmp/${safe}.body"
            cat "/tmp/${safe}.headers"
            if [ "$path" = 'index.html' ]; then
              grep -oE '\?v=[0-9]+' "/tmp/${safe}.body" | sort -u || true
            elif [ "$path" = 'config.js' ]; then
              grep 'palSiteVersion' "/tmp/${safe}.body" || true
            else
              grep -E 'romajiConsonantHint|ヒント3・ローマ字' "/tmp/${safe}.body" | head -n 3 || true
            fi
          done
