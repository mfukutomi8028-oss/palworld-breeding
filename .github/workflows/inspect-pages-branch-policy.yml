name: Inspect github-pages branch policies

on:
  pull_request:

permissions:
  contents: read
  deployments: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: List deployment branch policies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments/github-pages/deployment-branch-policies" | tee /tmp/policies.json
          echo
          python - <<'PY'
          import json
          data=json.load(open('/tmp/policies.json',encoding='utf-8'))
          print(json.dumps(data,ensure_ascii=False,indent=2))
          PY
