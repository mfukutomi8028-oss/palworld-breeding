name: Inspect latest Pages build error

on:
  pull_request:

permissions:
  contents: read
  pages: read

jobs:
  inspect-build:
    runs-on: ubuntu-latest
    steps:
      - name: Read latest Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds/latest" | tee /tmp/build.json
          echo
          python - <<'PY'
          import json
          data=json.load(open('/tmp/build.json',encoding='utf-8'))
          print(json.dumps({
            'status':data.get('status'),
            'commit':data.get('commit'),
            'created_at':data.get('created_at'),
            'updated_at':data.get('updated_at'),
            'error':data.get('error'),
            'pusher':(data.get('pusher') or {}).get('login'),
          },ensure_ascii=False,indent=2))
          PY
