name: Cancel superseded legacy Pages run

on:
  pull_request:
    types: [synchronize]

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel legacy dynamic deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATUS="$(curl -sS -o /tmp/cancel.json -w '%{http_code}' -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/31104300277/cancel")"
          cat /tmp/cancel.json || true
          echo "HTTP $STATUS"
          if [ "$STATUS" != "202" ] && [ "$STATUS" != "409" ]; then
            exit 1
          fi
