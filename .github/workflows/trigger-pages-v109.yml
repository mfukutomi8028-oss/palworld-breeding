name: Inspect github-pages deployment states

on:
  pull_request:
    types: [synchronize]

permissions:
  actions: read
  contents: read
  deployments: read
  pages: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: List GitHub deployment states
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/deployments?environment=github-pages&per_page=30" > /tmp/deployments.json
          python - <<'PY'
          import json, os, urllib.request
          token=os.environ['GH_TOKEN']
          deployments=json.load(open('/tmp/deployments.json',encoding='utf-8'))
          output=[]
          for deployment in deployments:
            req=urllib.request.Request(
              deployment['statuses_url']+'?per_page=20',
              headers={
                'Accept':'application/vnd.github+json',
                'Authorization':f'Bearer {token}',
                'X-GitHub-Api-Version':'2022-11-28',
              }
            )
            with urllib.request.urlopen(req) as response:
              statuses=json.load(response)
            output.append({
              'id':deployment.get('id'),
              'sha':deployment.get('sha'),
              'ref':deployment.get('ref'),
              'created_at':deployment.get('created_at'),
              'updated_at':deployment.get('updated_at'),
              'transient_environment':deployment.get('transient_environment'),
              'production_environment':deployment.get('production_environment'),
              'statuses':[
                {
                  'id':status.get('id'),
                  'state':status.get('state'),
                  'description':status.get('description'),
                  'environment_url':status.get('environment_url'),
                  'created_at':status.get('created_at'),
                  'updated_at':status.get('updated_at'),
                } for status in statuses
              ],
            })
          print(json.dumps(output,ensure_ascii=False,indent=2))
          PY
