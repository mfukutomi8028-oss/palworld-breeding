name: Trigger fresh Pages v109 build

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read
  pages: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Request a fresh Pages build from current main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds" | tee /tmp/pages-build.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/pages-build.json',encoding='utf-8'))
          print(json.dumps(data,ensure_ascii=False,indent=2))
          if data.get('status') not in {'queued','building'}:
              raise SystemExit('Pages build request was not accepted')
          PY
