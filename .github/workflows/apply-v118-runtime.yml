name: Apply final v118 runtime corrections

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.pull_request.head.sha, 'never') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-paldex-growth-v118
          fetch-depth: 0
      - name: Apply deterministic runtime correction
        run: python scripts/patch-v118-runtime.py
      - name: Validate patched JavaScript
        run: |
          node --check app-pal-growth.js
          grep -q '★4になると、元から持つすべての作業適性が+1' app-pal-growth.js
          ! grep -q '上位${star}枠まで+1' app-pal-growth.js
      - name: Commit safely
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-pal-growth.js
          if git diff --cached --quiet; then
            echo 'Runtime already current.'
            exit 0
          fi
          git commit -m '[v118-runtime] Align Work Suitability with current condensation rules'
          git fetch origin feature-paldex-growth-v118
          git rebase origin/feature-paldex-growth-v118
          git push origin HEAD:feature-paldex-growth-v118
