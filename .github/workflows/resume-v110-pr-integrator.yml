name: Integrate resumed v110 PR

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.pull_request.head.ref == 'resume-v110-finalize'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: resume-v110-finalize
          fetch-depth: 0

      - name: Stop when the v110 integration is already present
        id: state
        run: |
          if grep -q '?v=110' index.html && grep -q 'palSiteVersion = "110"' config.js; then
            echo 'complete=true' >> "$GITHUB_OUTPUT"
          else
            echo 'complete=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Repair the interrupted integrator without regenerating data
        if: steps.state.outputs.complete != 'true'
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/apply-paldex-stats-v110.py')
          text = path.read_text(encoding='utf-8')
          old = 'replace_once("index.html", "?v=109", "?v=110")'
          new = '''index_file = Path("index.html")
          index_text = index_file.read_text(encoding="utf-8")
          version_count = index_text.count("?v=109")
          if version_count < 1:
              raise RuntimeError("index.html: no v109 cache references were found")
          index_file.write_text(index_text.replace("?v=109", "?v=110"), encoding="utf-8")'''
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          elif 'version_count = index_text.count("?v=109")' not in text:
              raise SystemExit('Unexpected apply-paldex-stats-v110.py state')
          PY

      - name: Apply only the unfinished v110 integration
        if: steps.state.outputs.complete != 'true'
        run: |
          test -s data/pal-stats-v1.json
          test -s data/pals-v1.json
          python scripts/apply-paldex-stats-v110.py
          node scripts/validate-pal-stats-v110.mjs
          node --check app-core.js
          node --check app-data.js
          node --check app-explore.js
          node --check app-actions.js
          grep -q '?v=110' index.html
          grep -q 'palSiteVersion = "110"' config.js

      - name: Commit integrated artifacts to the PR branch
        if: steps.state.outputs.complete != 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/apply-paldex-stats-v110.py \
            data/pals-v1.json data/pal-stats-v1.json data/SOURCES.md \
            app-core.js app-data.js app-explore.js app-actions.js ui-shell.js \
            style-components.css style-responsive.css index.html config.js
          git commit -m '[pal-stats-v110] Complete verified stats and Paldex integration'
          git push origin HEAD:resume-v110-finalize
