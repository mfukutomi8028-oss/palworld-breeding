name: Validate static application

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check ui-shell.js
          node --check app-discovery-shell.js
          node --check app-core.js
          node --check app-records.js
          node --check app-discovery.js
          node --check app-explore.js
          node --check app-review.js
          node --check app-status.js
          node --check app-data.js
          node --check app-actions.js
          node --check app-pal-details-v111.js
          node --check app-ux-v117.js
          node --check app-pal-growth.js
          node --check scripts/validate-v103-data.mjs
          node --check scripts/validate-pal-stats-v110.mjs
          node --check scripts/validate-pal-growth-v118.mjs
          node --check scripts/validate-site-version.mjs
          node --check scripts/smoke-browser.mjs
          node --check scripts/smoke-browser-http-aware.mjs
          node --check scripts/smoke-v107.mjs
          node --check scripts/smoke-hints.mjs
          node --check scripts/smoke-pal-stats-v110.mjs
          node --check scripts/smoke-pal-growth-v118.mjs

      - name: Validate entrypoint and local assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          html = Path('index.html').read_text(encoding='utf-8')
          refs = re.findall(r'(?:src|href)="([^"]+\.(?:js|css))(?:\?[^\"]*)?"', html)
          missing = [ref for ref in refs if not Path(ref).exists()]
          assert not missing, f'Missing entrypoint files: {missing}'
          for required_ref in ['app-data.js','app-status.js','app-discovery.js','app-discovery-shell.js','app-pal-details-v111.js','app-ux-v117.js','app-pal-growth.js','style-pal-growth.css']:
              assert required_ref in refs, f'Missing release reference: {required_ref}'
          assert 'hint-v108.js' not in refs, 'Legacy hint correction is still loaded'
          assert 'pal-images.js' not in refs, 'The broken v102 loader is still referenced'
          versions = set(re.findall(r'\?v=(\d+)', html))
          assert versions == {'118'}, f'Expected only v118 cache busting, got {versions}'

          required = [
              'data/pals-v1.json',
              'data/pal-stats-v1.json',
              'data/pal-growth-v1.json',
              'data/pal-details-v1.json',
              'data/pal-localization-ja-v1.json',
              'data/breeding-v1.json',
              'data/pal-images-v1.json',
              'data/SOURCES.md',
              'assets/unknown-pal-v8.svg',
              'docs/V118_IMPLEMENTATION_PROMPT.md',
          ]
          missing_required = [path for path in required if not Path(path).exists()]
          assert not missing_required, f'Missing local data/assets: {missing_required}'
          assert not Path('assets/unknown-pal-v8.png').exists(), 'Invalid legacy placeholder still exists'

          legacy = [
              'enhancements.js','workflow-v54.js','refinement-v55.js','refinement-v56.js',
              'refinement-v58.js','refinement-v59.js','refinement-v60.js','refinement-v62.js',
              'refinement-v63.js','pal-images.js','hint-v108.js'
          ]
          bad = [name for name in legacy if name in html]
          assert not bad, f'Legacy files still referenced: {bad}'
          print('Entrypoint references:', refs)
          PY

      - name: Validate HTML IDs and CSS braces
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          shell = Path('ui-shell.js').read_text(encoding='utf-8') + Path('app-discovery-shell.js').read_text(encoding='utf-8')
          ids = re.findall(r'\bid="([^"]+)"', shell)
          dup = sorted({item for item in ids if ids.count(item) > 1})
          assert not dup, f'Duplicate IDs: {dup}'
          for path in ['style-foundation.css','style-components.css','style-responsive.css','style-discovery-v105.css','style-pal-details-v111.css','style-ux-v116.css','style-pal-growth.css']:
              text = Path(path).read_text(encoding='utf-8')
              assert text.count('{') == text.count('}'), f'Unbalanced braces: {path}'
          print(f'Validated {len(ids)} unique IDs')
          PY

      - name: Validate local Palworld data, fixed PalDB stats and v118 growth data
        run: |
          node scripts/validate-v103-data.mjs
          node scripts/validate-pal-stats-v110.mjs
          node scripts/validate-pal-growth-v118.mjs
          node scripts/validate-site-version.mjs

      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start GitHub Pages-compatible local server
        run: |
          python3 -m http.server 4173 > /tmp/pal-site.log 2>&1 &
          echo $! > /tmp/pal-site.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pal-site.log
          exit 1

      - name: Browser smoke tests
        env:
          APP_URL: http://127.0.0.1:4173/
        run: |
          node scripts/smoke-browser-http-aware.mjs
          node scripts/smoke-v107.mjs
          node scripts/smoke-hints.mjs
          node scripts/smoke-pal-stats-v110.mjs
          node scripts/smoke-pal-growth-v118.mjs

  public-pages-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Wait for GitHub Pages v118 deployment
        run: |
          URL="https://mfukutomi8028-oss.github.io/palworld-breeding/index.html"
          for attempt in $(seq 1 90); do
            body="$(curl -fsS "${URL}?check=${GITHUB_SHA}-${attempt}-$(date +%s)" || true)"
            if echo "$body" | grep -q 'app-pal-growth.js?v=118'; then
              exit 0
            fi
            sleep 10
          done
          echo "GitHub Pages did not publish v118 within the expected time."
          exit 1
      - name: Test published GitHub Pages
        env:
          APP_URL: https://mfukutomi8028-oss.github.io/palworld-breeding/
        run: |
          node scripts/smoke-browser-http-aware.mjs
          node scripts/smoke-v107.mjs
          node scripts/smoke-hints.mjs
          node scripts/smoke-pal-stats-v110.mjs
          node scripts/smoke-pal-growth-v118.mjs
