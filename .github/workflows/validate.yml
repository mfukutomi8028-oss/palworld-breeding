name: Validate static application

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check ui-shell.js
          node --check app-core.js
          node --check app-records.js
          node --check app-explore.js
          node --check app-review.js
          node --check app-actions.js
      - name: Validate entrypoint references
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          refs = re.findall(r'(?:src|href)="([^"]+\.(?:js|css))(?:\?[^\"]*)?"', html)
          missing = [ref for ref in refs if not Path(ref).exists()]
          assert not missing, f'Missing entrypoint files: {missing}'
          legacy = ['enhancements.js','workflow-v54.js','refinement-v55.js','refinement-v56.js','refinement-v58.js','refinement-v59.js','refinement-v60.js','refinement-v62.js','refinement-v63.js']
          bad = [name for name in legacy if name in html]
          assert not bad, f'Legacy files still referenced: {bad}'
          print('Entrypoint references:', refs)
          PY
      - name: Validate HTML IDs and CSS braces
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          shell = Path('ui-shell.js').read_text(encoding='utf-8')
          ids = re.findall(r'\bid="([^"]+)"', shell)
          dup = sorted({item for item in ids if ids.count(item) > 1})
          assert not dup, f'Duplicate IDs: {dup}'
          for path in ['style-foundation.css','style-components.css','style-responsive.css']:
              text = Path(path).read_text(encoding='utf-8')
              assert text.count('{') == text.count('}'), f'Unbalanced braces: {path}'
          print(f'Validated {len(ids)} unique IDs')
          PY
      - name: Validate fixed Palworld 1.0 breeding engine
        run: |
          curl -fsSL "https://raw.githubusercontent.com/palcalc-tools/palworld-1.0-calculator/979258dfb579f1c5d068d41be0f5dd7297b401a8/index.html" -o /tmp/palcalc.html
          node <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('/tmp/palcalc.html', 'utf8');
          const marker = 'const DATA = ';
          const start = text.indexOf(marker);
          if (start < 0) throw new Error('DATA marker not found');
          const jsonStart = start + marker.length;
          const jsonEnd = text.indexOf(';\nconst ', jsonStart);
          if (jsonEnd < 0) throw new Error('DATA end marker not found');
          const data = JSON.parse(text.slice(jsonStart, jsonEnd));
          const pals = Object.keys(data.pals || {});
          const unique = Array.isArray(data.unique) ? data.unique : [];
          const directional = unique.filter(([a,b]) => new Set([a,b]).has('CatMage') && new Set([a,b]).has('FoxMage'));
          if (pals.length !== 299) throw new Error(`Expected 299 forms, got ${pals.length}`);
          if (unique.length !== 164) throw new Error(`Expected 164 unique rows, got ${unique.length}`);
          if (directional.length !== 2) throw new Error(`Expected 2 gender-directional rows, got ${directional.length}`);
          console.log(`Validated ${pals.length} forms, ${unique.length} unique rows, ${directional.length} directional rows`);
          NODE
