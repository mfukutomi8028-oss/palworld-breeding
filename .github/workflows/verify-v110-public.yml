name: Verify published v110 once

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    if: github.event.pull_request.head.ref == 'verify-v110-public'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Wait for GitHub Pages v110
        run: |
          base='https://mfukutomi8028-oss.github.io/palworld-breeding'
          for attempt in $(seq 1 90); do
            stamp="${GITHUB_RUN_ID}-${attempt}-$(date +%s)"
            config="$(curl -fsSL "${base}/config.js?verify=${stamp}" || true)"
            html="$(curl -fsSL "${base}/index.html?verify=${stamp}" || true)"
            if echo "$config" | grep -q 'palSiteVersion = "110"' && echo "$html" | grep -q '?v=110'; then
              echo 'GitHub Pages is serving v110.'
              exit 0
            fi
            echo "Attempt ${attempt}: waiting for v110 publication"
            sleep 10
          done
          echo 'GitHub Pages did not publish v110 within 15 minutes.'
          exit 1

      - name: Install Chromium test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Test the published v110 application
        env:
          APP_URL: https://mfukutomi8028-oss.github.io/palworld-breeding/
        run: |
          node scripts/smoke-browser-http-aware.mjs
          node scripts/smoke-v107.mjs
          node scripts/smoke-hints.mjs
          node scripts/smoke-pal-stats-v110.mjs
