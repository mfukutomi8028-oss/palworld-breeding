name: Inspect Pages workflow runs

on:
  pull_request:

permissions:
  actions: read
  contents: read
  pages: read

jobs:
  inspect-actions:
    runs-on: ubuntu-latest
    steps:
      - name: List recent workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" > /tmp/runs.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/runs.json',encoding='utf-8'))
          rows=[]
          for run in data.get('workflow_runs',[]):
            name=(run.get('name') or '')
            path=(run.get('path') or '')
            if 'page' in name.lower() or 'page' in path.lower() or run.get('head_sha')=='8eb3a949be1ed48d891f119f4468c6b19970d471':
              rows.append({
                'id':run.get('id'),'name':name,'path':path,'event':run.get('event'),
                'status':run.get('status'),'conclusion':run.get('conclusion'),
                'head_sha':run.get('head_sha'),'created_at':run.get('created_at'),
                'jobs_url':run.get('jobs_url'),'logs_url':run.get('logs_url')
              })
          print(json.dumps(rows,ensure_ascii=False,indent=2))
          PY
