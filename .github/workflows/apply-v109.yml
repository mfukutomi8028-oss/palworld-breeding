name: Apply v109 discovery hint improvements

on:
  push:
    branches: [main]
    paths:
      - '.github/request-v109-research.txt'

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'Start v109 discovery hint improvements')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply v109 changes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new)

          def replace_function(text, start_name, next_name, replacement):
              start = text.index(f'function {start_name}(')
              end = text.index(f'\nfunction {next_name}(', start)
              return text[:start] + replacement.rstrip() + '\n\n' + text[end + 1:]

          discovery_path = Path('app-discovery.js')
          discovery = discovery_path.read_text(encoding='utf-8')

          discovery = replace_once(
              discovery,
              'state.reverseHintProgress = new Map();\nPAGE_META.hints',
              'state.reverseHintProgress = new Map();\nstate.hintForwardSelectionKey = "";\nstate.hintReverseSelectionKey = "";\nPAGE_META.hints',
              'hint selection state',
          )

          discovery = replace_function(discovery, 'createHintProgress', 'discoveredPalIdSet', '''function createHintProgress(){
            return {elements:false,number:0,romaji:[],japanese:[],silhouette:false,answer:false};
          }''')

          discovery = replace_function(discovery, 'resetHintProgress', 'hintCharacters', '''function resetHintProgress(){
            state.hintProgress = createHintProgress();
            state.reverseHintProgress = new Map();
            state.hintForwardSelectionKey = "";
            state.hintReverseSelectionKey = "";
          }''')

          discovery = replace_function(discovery, 'hintCharacters', 'hintPositionIndex', r'''function hintCharacters(value){
            return Array.from(String(value || "")).filter(character => !/\s/.test(character));
          }

          const ROMAJI_SINGLE = Object.freeze({
            "ア":"A","イ":"I","ウ":"U","エ":"E","オ":"O",
            "ァ":"A","ィ":"I","ゥ":"U","ェ":"E","ォ":"O",
            "カ":"KA","キ":"KI","ク":"KU","ケ":"KE","コ":"KO",
            "ガ":"GA","ギ":"GI","グ":"GU","ゲ":"GE","ゴ":"GO",
            "サ":"SA","シ":"SI","ス":"SU","セ":"SE","ソ":"SO",
            "ザ":"ZA","ジ":"ZI","ズ":"ZU","ゼ":"ZE","ゾ":"ZO",
            "タ":"TA","チ":"TI","ツ":"TU","テ":"TE","ト":"TO",
            "ダ":"DA","ヂ":"DI","ヅ":"DU","デ":"DE","ド":"DO",
            "ナ":"NA","ニ":"NI","ヌ":"NU","ネ":"NE","ノ":"NO",
            "ハ":"HA","ヒ":"HI","フ":"HU","ヘ":"HE","ホ":"HO",
            "バ":"BA","ビ":"BI","ブ":"BU","ベ":"BE","ボ":"BO",
            "パ":"PA","ピ":"PI","プ":"PU","ペ":"PE","ポ":"PO",
            "マ":"MA","ミ":"MI","ム":"MU","メ":"ME","モ":"MO",
            "ヤ":"YA","ユ":"YU","ヨ":"YO","ャ":"YA","ュ":"YU","ョ":"YO",
            "ラ":"RA","リ":"RI","ル":"RU","レ":"RE","ロ":"RO",
            "ワ":"WA","ヰ":"WI","ヱ":"WE","ヲ":"WO","ン":"N",
            "ヴ":"VU","ヵ":"KA","ヶ":"KE",
          });

          const ROMAJI_DIGRAPHS = Object.freeze({
            "キャ":"KYA","キュ":"KYU","キョ":"KYO","キェ":"KYE",
            "ギャ":"GYA","ギュ":"GYU","ギョ":"GYO","ギェ":"GYE",
            "シャ":"SYA","シュ":"SYU","ショ":"SYO","シェ":"SYE",
            "ジャ":"ZYA","ジュ":"ZYU","ジョ":"ZYO","ジェ":"ZYE",
            "チャ":"TYA","チュ":"TYU","チョ":"TYO","チェ":"TYE",
            "ヂャ":"DYA","ヂュ":"DYU","ヂョ":"DYO","ヂェ":"DYE",
            "ニャ":"NYA","ニュ":"NYU","ニョ":"NYO","ニェ":"NYE",
            "ヒャ":"HYA","ヒュ":"HYU","ヒョ":"HYO","ヒェ":"HYE",
            "ビャ":"BYA","ビュ":"BYU","ビョ":"BYO","ビェ":"BYE",
            "ピャ":"PYA","ピュ":"PYU","ピョ":"PYO","ピェ":"PYE",
            "ミャ":"MYA","ミュ":"MYU","ミョ":"MYO","ミェ":"MYE",
            "リャ":"RYA","リュ":"RYU","リョ":"RYO","リェ":"RYE",
            "テャ":"TYA","テュ":"TYU","テョ":"TYO","ティ":"TI",
            "デャ":"DYA","デュ":"DYU","デョ":"DYO","ディ":"DI",
            "ツァ":"TSA","ツィ":"TSI","ツェ":"TSE","ツォ":"TSO",
            "ファ":"FA","フィ":"FI","フェ":"FE","フォ":"FO","フャ":"FYA","フュ":"FYU","フョ":"FYO",
            "ウァ":"WA","ウィ":"WI","ウェ":"WE","ウォ":"WO",
            "クァ":"KWA","クィ":"KWI","クェ":"KWE","クォ":"KWO",
            "グァ":"GWA","グィ":"GWI","グェ":"GWE","グォ":"GWO",
            "ヴァ":"VA","ヴィ":"VI","ヴェ":"VE","ヴォ":"VO","ヴャ":"VYA","ヴュ":"VYU","ヴョ":"VYO",
            "イェ":"YE","スィ":"SI","ズィ":"ZI","トゥ":"TU","ドゥ":"DU",
          });

          function toKatakana(value){
            return Array.from(String(value || "").normalize("NFKC")).map(character=>{
              const code=character.charCodeAt(0);
              return code>=0x3041&&code<=0x3096?String.fromCharCode(code+0x60):character;
            }).join("");
          }

          function romajiConsonantHint(value){
            const source=toKatakana(value).replace(/亜種/g,"アシュ").replace(/変異/g,"ヘンイ");
            const result=[];
            for(let index=0;index<source.length;index+=1){
              const character=source[index];
              if(character==="ッ"){
                result.push("T");
                continue;
              }
              if(character==="ー"){
                result.push("ー");
                continue;
              }
              const pair=source.slice(index,index+2);
              const roman=ROMAJI_DIGRAPHS[pair]||ROMAJI_SINGLE[character]||"";
              if(ROMAJI_DIGRAPHS[pair])index+=1;
              if(roman){
                const letters=Array.from(roman.toUpperCase());
                const consonants=letters.filter(letter=>!/[AEIOU]/.test(letter));
                result.push(...(consonants.length?consonants:letters));
                continue;
              }
              if(/[A-Za-z0-9]/.test(character))result.push(character.toUpperCase());
            }
            return result;
          }

          function romajiHintSlotCount(){
            return Math.max(7,...state.pals.map(pal=>romajiConsonantHint(pal.name).length));
          }''')

          discovery = replace_function(discovery, 'hintPositionIndex', 'hintSilhouette', r'''function hintPositionIndex(length,key){
            const slot=HINT_POSITION_DEFINITIONS.findIndex(position=>position.key===key);
            if(slot<0)return -1;
            if(length<=HINT_POSITION_DEFINITIONS.length)return slot<length?slot:-1;
            const last=length-1;
            if(key==="first")return 0;
            if(key==="front2")return 1;
            if(key==="front3")return 2;
            if(key==="middle")return Math.floor(last/2);
            if(key==="back3")return last-2;
            if(key==="back2")return last-1;
            return last;
          }

          function hintCharacterAt(value,key){
            const characters=hintCharacters(value),index=hintPositionIndex(characters.length,key);
            return index>=0&&index<characters.length?characters[index]:"×";
          }

          function fixedNumberHint(value,revealed){
            const characters=hintCharacters(value);
            return Array.from({length:4},(_,index)=>index<revealed&&index<characters.length?characters[index]:"?").join(" ");
          }

          function positionHintPanel(type,title,value,revealed,scope,candidateId=""){
            const selected=new Set(Array.isArray(revealed)?revealed:[]),characters=hintCharacters(value),sequential=characters.length<=HINT_POSITION_DEFINITIONS.length;
            const buttons=HINT_POSITION_DEFINITIONS.map((position,slot)=>{
              const unavailable=hintPositionIndex(characters.length,position.key)<0,isRevealed=selected.has(position.key),visible=isRevealed||unavailable;
              const attribute=scope==="reverse"
                ? `data-reverse-position="${escapeHtml(candidateId)}|${type}|${position.key}"`
                : `data-forward-position="${type}|${position.key}"`;
              const label=sequential?`${slot+1}文字目`:position.label;
              return `<button class="hint-position${isRevealed?" is-revealed":""}${unavailable?" is-unavailable":""}" type="button" ${attribute} ${visible?"disabled":""}><span>${label}</span><strong>${visible?escapeHtml(unavailable?"×":hintCharacterAt(value,position.key)):"?"}</strong></button>`;
            }).join("");
            return `<section class="hint-letter-panel"><div class="hint-letter-panel__heading"><strong>${title}</strong><span>${sequential?"開きたい文字を選択・名前のない位置は×":"開きたい場所を選択・文字数は非表示"}</span></div><div class="hint-position-grid">${buttons}</div></section>`;
          }

          function romajiHintPanel(value,revealed,scope,candidateId=""){
            const selected=new Set(Array.isArray(revealed)?revealed:[]),tokens=romajiConsonantHint(value),slotCount=romajiHintSlotCount();
            const buttons=Array.from({length:slotCount},(_,index)=>{
              const key=`slot-${index}`,isRevealed=selected.has(key),missing=isRevealed&&index>=tokens.length;
              const attribute=scope==="reverse"
                ? `data-reverse-position="${escapeHtml(candidateId)}|romaji|${key}"`
                : `data-forward-position="romaji|${key}"`;
              return `<button class="hint-position${isRevealed&&!missing?" is-revealed":""}${missing?" is-missing":""}" type="button" ${attribute} ${isRevealed?"disabled":""} aria-label="ローマ字子音の${index+1}文字目を開く"><span>${index+1}文字目</span><strong>${isRevealed?escapeHtml(missing?"×":tokens[index]):"?"}</strong></button>`;
            }).join("");
            return `<section class="hint-letter-panel hint-letter-panel--romaji"><div class="hint-letter-panel__heading"><strong>ヒント3・ローマ字の子音</strong><span>子音を1文字ずつ開示・母音だけの文字は母音を表示</span></div><div class="hint-position-grid hint-position-grid--romaji">${buttons}</div></section>`;
          }''')

          discovery = replace_function(discovery, 'hintStepButton', 'renderForwardHints', r'''function hintStepButton(attribute,title,value,disabled=false){
            return `<button class="hint-step${disabled?" is-disabled":""}" type="button" ${attribute} ${disabled?"disabled":""}><span>${title}</span><strong>${value}</strong></button>`;
          }

          function openHintTrial(parentA,parentB){
            const existing=recordStateForPair(parentA,parentB);
            if(existing){
              state.selectedRecordId=existing.id;
              switchView("records");
              toast("既存の配合記録を開きました");
              return;
            }
            openRecordDialog("",{parentA,parentB,resultPal:""});
          }''')

          discovery = replace_function(discovery, 'renderForwardHints', 'reverseHintSelection', r'''function renderForwardHints(board){
            const {a,b,combo,child}=forwardHintCombination();
            if(!a||!b){
              board.innerHTML=`<div class="hint-empty"><img src="${PLAIN_EGG_ICON}" alt=""><h3>親パルを2体選択</h3><p>このルームで発見済みのパルから親を選ぶと、結果パルのヒントを段階的に確認できます。</p></div>`;
              return;
            }
            if(!state.matrixReady){
              board.innerHTML=`<div class="hint-empty"><h3>配合データを準備しています</h3></div>`;
              return;
            }
            if(!child){
              board.innerHTML=`<div class="hint-empty"><h3>ヒントを作成できません</h3><p>${escapeHtml(combo?.note||"この組み合わせの結果データがありません。")}</p></div>`;
              return;
            }
            const recorded=recordStateForPair(a.name,b.name);
            if(recorded?.resultPal){
              board.innerHTML=`<div class="hint-discovered"><span class="section-kicker">DISCOVERED</span><h3>この配合は発見済みです</h3><div class="hint-recipe">${palChip(a.name)}<span>＋</span>${palChip(b.name)}<span>→</span>${palChip(recorded.resultPal,{result:true})}</div><button class="button button--ghost" type="button" data-hint-open-record="${escapeHtml(recorded.id)}">配合記録を開く</button></div>`;
              $('[data-hint-open-record]',board)?.addEventListener("click",event=>{state.selectedRecordId=event.currentTarget.dataset.hintOpenRecord;switchView("records");});
              return;
            }

            const progress=state.hintProgress;
            const elementText=progress.elements?(child.elements.join("・")||"属性データなし"):"未開封";
            const numberText=`No.${fixedNumberHint(child.no,progress.number)}`;
            const visual=progress.silhouette?hintSilhouette(child):`<div class="hint-result-question">?</div>`;
            const pendingNotice=recorded?`<div class="hint-trial-status"><span class="status-badge status-badge--pending">確認中として登録済み</span><p>この親ペアは既に記録されています。答えが分かったら既存記録へ結果を入力できます。</p></div>`:"";
            const planAction=recorded
              ? `<button class="button button--ghost" type="button" data-hint-edit-record="${escapeHtml(recorded.id)}">確認中の記録を開く</button>`
              : `<button class="button button--secondary" type="button" data-forward-plan="${escapeHtml(a.id)}|${escapeHtml(b.id)}">この親ペアを試す予定に追加</button>`;
            const answer=progress.answer?`<div class="hint-answer">${palChip(child.name,{result:true})}${recorded?`<button class="button button--primary" type="button" data-hint-edit-record="${escapeHtml(recorded.id)}">結果を入力する</button>`:`<button class="button button--primary" type="button" data-forward-record="${escapeHtml(a.id)}|${escapeHtml(b.id)}|${escapeHtml(child.id)}">この配合を記録</button>`}</div>`:"";
            board.innerHTML=`<div class="hint-mystery">${pendingNotice}<div class="hint-recipe hint-recipe--parents">${palChip(a.name)}<span>＋</span>${palChip(b.name)}<span>→</span><div class="hint-result-visual">${visual}</div></div><div class="hint-steps hint-steps--compact">${hintStepButton('data-hint-action="elements"',"ヒント1・属性",elementText,progress.elements)}${hintStepButton('data-hint-action="number"',"ヒント2・図鑑番号",numberText,progress.number>=4)}${hintStepButton('data-hint-action="silhouette"',"ヒント5・シルエット",progress.silhouette?"表示済み":"画像の形を見る",progress.silhouette)}</div><div class="hint-letter-groups">${romajiHintPanel(child.name,progress.romaji,"forward")}${positionHintPanel("japanese","ヒント4・日本語名",child.name,progress.japanese,"forward")}</div><div class="hint-final"><p>ローマ字ヒントは子音だけを表示します。小さい「っ」はT、小さい「ゃ・ゅ・ょ」はYを含み、伸ばし棒は「ー」のままです。名前が続かない位置は、クリック後に赤い×が表示されます。</p><div class="hint-final__actions">${planAction}${progress.answer?"":`<button class="button button--ghost" type="button" data-hint-action="answer">答えを見る</button>`}</div>${answer}</div></div>`;

            $$('[data-hint-action]',board).forEach(button=>button.addEventListener("click",()=>{
              const action=button.dataset.hintAction;
              if(action==="elements")progress.elements=true;
              if(action==="number")progress.number=Math.min(4,progress.number+1);
              if(action==="silhouette")progress.silhouette=true;
              if(action==="answer")progress.answer=true;
              renderHints();
            }));
            $$('[data-forward-position]',board).forEach(button=>button.addEventListener("click",()=>{
              const[type,key]=button.dataset.forwardPosition.split("|");
              if(!progress[type].includes(key))progress[type].push(key);
              renderHints();
            }));
            $('[data-forward-plan]',board)?.addEventListener("click",event=>{
              const[aId,bId]=event.currentTarget.dataset.forwardPlan.split("|");
              const parentA=getPal(aId),parentB=getPal(bId);
              if(parentA&&parentB)openHintTrial(parentA.name,parentB.name);
            });
            $$('[data-hint-edit-record]',board).forEach(button=>button.addEventListener("click",()=>openRecordDialog(button.dataset.hintEditRecord,{focus:"result"})));
            $('[data-forward-record]',board)?.addEventListener("click",event=>handleComboRecord(event.currentTarget.dataset.forwardRecord));
            attachImageFallbacks(board);
          }''')

          discovery = replace_function(discovery, 'reverseHintCard', 'renderReverseHints', r'''function reverseHintCard(item,index,target,known){
            if(item.discovered){
              return `<article class="reverse-hint-card reverse-hint-card--discovered"><header class="reverse-hint-card__header"><span class="section-kicker">候補 ${index+1}</span><strong>発見済み</strong></header><div class="hint-recipe">${palChip(known.name)}<span>＋</span>${palChip(item.pal.name)}<span>→</span>${palChip(target.name,{result:true})}</div><button class="button button--ghost" type="button" data-reverse-open-record="${escapeHtml(item.record.id)}">配合記録を開く</button></article>`;
            }
            const progress=reverseProgressFor(item.pal.id);
            const elementText=progress.elements?(item.pal.elements.join("・")||"属性データなし"):"未開封";
            const numberText=`No.${fixedNumberHint(item.pal.no,progress.number)}`;
            const visual=progress.silhouette?hintSilhouette(item.pal):`<div class="hint-result-question">?</div>`;
            const action=value=>`data-reverse-action="${escapeHtml(item.pal.id)}|${value}"`;
            const existingLabel=item.record?(item.record.resultPal?"既存記録あり":"確認中として登録済み"):"";
            const answer=progress.answer?`<div class="hint-answer">${palChip(item.pal.name)}${item.record?`<button class="button button--primary" type="button" data-reverse-edit-record="${escapeHtml(item.record.id)}">既存記録を開く</button>`:`<button class="button button--primary" type="button" data-reverse-record="${escapeHtml(item.pal.id)}">この組み合わせを記録</button>`}</div>`:"";
            return `<article class="reverse-hint-card" data-reverse-candidate="${escapeHtml(item.pal.id)}"><header class="reverse-hint-card__header"><div><span class="section-kicker">候補 ${index+1}</span><strong>もう片方の親パル</strong></div><div class="reverse-hint-card__badges">${existingLabel?`<span class="status-badge status-badge--pending">${existingLabel}</span>`:""}${item.combo.special?`<span class="issue-badge">特殊配合候補</span>`:""}</div></header><div class="hint-reverse-equation">${palChip(known.name)}<span>＋</span><div class="hint-result-visual">${visual}</div><span>→</span>${palChip(target.name,{result:true})}</div><div class="hint-steps hint-steps--compact">${hintStepButton(action("elements"),"ヒント1・属性",elementText,progress.elements)}${hintStepButton(action("number"),"ヒント2・図鑑番号",numberText,progress.number>=4)}${hintStepButton(action("silhouette"),"ヒント5・シルエット",progress.silhouette?"表示済み":"画像の形を見る",progress.silhouette)}</div><div class="hint-letter-groups">${romajiHintPanel(item.pal.name,progress.romaji,"reverse",item.pal.id)}${positionHintPanel("japanese","ヒント4・日本語名",item.pal.name,progress.japanese,"reverse",item.pal.id)}</div><div class="hint-final"><p>候補ごとにヒントの開示状態を分けています。ローマ字の子音枠は、全パルで最も長い名前に合わせています。</p>${progress.answer?"":`<button class="button button--ghost" type="button" ${action("answer")}>答えを見る</button>`}${answer}</div></article>`;
          }''')

          discovery = replace_function(discovery, 'renderReverseHints', 'renderHints', r'''function renderReverseHints(board){
            const {target,known}=reverseHintSelection();
            if(!target||!known){
              board.innerHTML=`<div class="hint-empty"><img src="${PLAIN_EGG_ICON}" alt=""><h3>目標パルと片親を選択</h3><p>両方を選択すると、成立するもう片方の親候補を候補ごとに表示します。</p></div>`;
              return;
            }
            if(!state.matrixReady){
              board.innerHTML=`<div class="hint-empty"><h3>配合データを準備しています</h3></div>`;
              return;
            }
            const candidates=reverseHintCandidates(target,known);
            if(!candidates.length){
              board.innerHTML=`<div class="hint-empty"><img src="${PLAIN_EGG_ICON}" alt=""><h3>該当する親候補がありません</h3><p>選択した目標パルと片親の組み合わせでは、利用できる配合候補を確認できませんでした。</p></div>`;
              return;
            }
            board.innerHTML=`<div class="reverse-hint-summary"><div><span class="section-kicker">REVERSE HINTS</span><h3>${candidates.length}件の親候補</h3><p>候補ごとに独立して、ローマ字の子音・日本語名・属性・図鑑番号・シルエットを確認できます。</p></div><div class="reverse-hint-summary__recipe">${palChip(known.name)}<span>＋</span><strong>?</strong><span>→</span>${palChip(target.name,{result:true})}</div></div><div class="reverse-hint-list">${candidates.map((item,index)=>reverseHintCard(item,index,target,known)).join("")}</div>`;

            $$('[data-reverse-action]',board).forEach(button=>button.addEventListener("click",()=>{
              const[candidateId,action]=button.dataset.reverseAction.split("|");
              const progress=reverseProgressFor(candidateId);
              if(action==="elements")progress.elements=true;
              if(action==="number")progress.number=Math.min(4,progress.number+1);
              if(action==="silhouette")progress.silhouette=true;
              if(action==="answer")progress.answer=true;
              renderHints();
            }));
            $$('[data-reverse-position]',board).forEach(button=>button.addEventListener("click",()=>{
              const[candidateId,type,key]=button.dataset.reversePosition.split("|");
              const progress=reverseProgressFor(candidateId);
              if(!progress[type].includes(key))progress[type].push(key);
              renderHints();
            }));
            $$('[data-reverse-open-record]',board).forEach(button=>button.addEventListener("click",()=>{state.selectedRecordId=button.dataset.reverseOpenRecord;switchView("records");}));
            $$('[data-reverse-edit-record]',board).forEach(button=>button.addEventListener("click",()=>openRecordDialog(button.dataset.reverseEditRecord,{focus:"result"})));
            $$('[data-reverse-record]',board).forEach(button=>button.addEventListener("click",()=>{
              const candidate=getPal(button.dataset.reverseRecord);
              if(candidate)openRecordDialog("",{parentA:known.name,parentB:candidate.name,resultPal:target.name});
            }));
            attachImageFallbacks(board);
          }''')

          discovery = replace_function(discovery, 'renderHints', 'toggleGuideMode', r'''function forwardHintSelectionKey(){
            const a=getPal(state.pickerValues.hintParentA),b=getPal(state.pickerValues.hintParentB);
            return a&&b?pairKey(a.id,b.id):"";
          }

          function reverseHintSelectionKey(){
            const {target,known}=reverseHintSelection();
            return target&&known?`${target.id}|${known.id}`:"";
          }

          function syncHintProgressForSelection(){
            const forwardKey=forwardHintSelectionKey();
            if(forwardKey!==state.hintForwardSelectionKey){
              state.hintForwardSelectionKey=forwardKey;
              state.hintProgress=createHintProgress();
            }
            const reverseKey=reverseHintSelectionKey();
            if(reverseKey!==state.hintReverseSelectionKey){
              state.hintReverseSelectionKey=reverseKey;
              state.reverseHintProgress=new Map();
            }
          }

          function renderHints(){
            const board=byId("hintBoard");
            if(!board)return;
            syncHintProgressForSelection();
            const reverse=state.hintMode==="reverse";
            $$('[data-hint-mode]').forEach(button=>{
              const active=button.dataset.hintMode===state.hintMode;
              button.classList.toggle("is-active",active);
              button.setAttribute("aria-selected",String(active));
            });
            byId("hintForwardPanel")?.classList.toggle("is-hidden",reverse);
            byId("hintReversePanel")?.classList.toggle("is-hidden",!reverse);
            renderPickerShell("hintParentA");
            renderPickerShell("hintParentB");
            renderPickerShell("hintReverseTarget");
            renderPickerShell("hintReverseParentA");
            if(reverse)renderReverseHints(board);else renderForwardHints(board);
          }''')

          discovery = replace_function(discovery, 'bindHintModeControls', 'bindHintModeControls', '') if False else discovery
          start = discovery.index('function bindHintModeControls(')
          call = discovery.index('\nbindHintModeControls();', start)
          discovery = discovery[:start] + '''function bindHintModeControls(){
            $$('[data-hint-mode]').forEach(button=>{
              if(button.dataset.hintBound)return;
              button.dataset.hintBound="1";
              button.addEventListener("click",()=>{state.hintMode=button.dataset.hintMode;renderHints();});
            });
          }
          ''' + discovery[call:]

          discovery_path.write_text(discovery, encoding='utf-8')

          actions_path = Path('app-actions.js')
          actions = actions_path.read_text(encoding='utf-8')
          actions = replace_once(
              actions,
              "function onPickerChange(target){if(target.startsWith('breed'))renderBreedingSearch();else if(target.startsWith('hint')){resetHintProgress();renderHints();}else{renderPickerShell(target);renderDuplicateNotice();}}",
              "function onPickerChange(target){if(target.startsWith('breed'))renderBreedingSearch();else if(target.startsWith('hint'))renderHints();else{renderPickerShell(target);renderDuplicateNotice();}}",
              'picker hint reset',
          )
          actions = replace_once(
              actions,
              "byId('hintSwapParents').addEventListener('click',()=>{[state.pickerValues.hintParentA,state.pickerValues.hintParentB]=[state.pickerValues.hintParentB,state.pickerValues.hintParentA];resetHintProgress();renderHints();});",
              "byId('hintSwapParents').addEventListener('click',()=>{[state.pickerValues.hintParentA,state.pickerValues.hintParentB]=[state.pickerValues.hintParentB,state.pickerValues.hintParentA];renderHints();});",
              'hint parent swap',
          )
          actions = replace_once(
              actions,
              "byId('hintReset').addEventListener('click',()=>{state.pickerValues.hintParentA='';state.pickerValues.hintParentB='';resetHintProgress();renderHints();});",
              "byId('hintReset').addEventListener('click',()=>{if(state.hintMode==='reverse'){state.pickerValues.hintReverseTarget='';state.pickerValues.hintReverseParentA='';state.hintReverseSelectionKey='';state.reverseHintProgress=new Map();}else{state.pickerValues.hintParentA='';state.pickerValues.hintParentB='';state.hintForwardSelectionKey='';state.hintProgress=createHintProgress();}renderHints();});",
              'mode-aware hint reset',
          )
          actions_path.write_text(actions, encoding='utf-8')

          old_style = Path('style-discovery-v105.css')
          style = old_style.read_text(encoding='utf-8')
          style += '''
          .hint-position-grid--romaji{grid-template-columns:repeat(auto-fit,minmax(58px,1fr))}.hint-position.is-missing,.hint-position.is-unavailable{border-color:rgba(255,104,122,.5);background:rgba(255,104,122,.08)}.hint-position.is-missing strong,.hint-position.is-unavailable strong{color:#ff7889}.hint-final__actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.hint-trial-status{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid rgba(235,192,80,.22);border-radius:14px;background:rgba(235,192,80,.055)}.hint-trial-status p{margin:0;color:var(--text-soft);font-size:11px;line-height:1.55}.status-badge--pending{color:#f0cd65;border-color:rgba(240,205,101,.25);background:rgba(240,205,101,.08)}.reverse-hint-card__badges{display:flex;align-items:center;justify-content:flex-end;gap:7px;flex-wrap:wrap}
          @media(max-width:680px){.hint-position-grid--romaji{grid-template-columns:repeat(3,minmax(0,1fr))}.hint-final__actions,.hint-final__actions .button{width:100%}.hint-trial-status{align-items:flex-start;flex-direction:column}}
          '''
          Path('style-discovery.css').write_text(style, encoding='utf-8')
          old_style.unlink()

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          index = index.replace('style-discovery-v105.css?v=108', 'style-discovery.css?v=109')
          index = index.replace('  <script src="hint-v108.js?v=108" defer></script>\n', '')
          index = index.replace('?v=108', '?v=109')
          index_path.write_text(index, encoding='utf-8')

          config_path = Path('config.js')
          config = config_path.read_text(encoding='utf-8').replace('window.palSiteVersion = "108";', 'window.palSiteVersion = "109";')
          config_path.write_text(config, encoding='utf-8')

          Path('hint-v108.js').unlink(missing_ok=True)
          Path('scripts/smoke-v108-hint.mjs').unlink(missing_ok=True)

          smoke = r'''import { chromium } from "playwright";

          const baseUrl = process.env.APP_URL || "http://127.0.0.1:4173/";
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 1440, height: 1000 } });
          const page = await context.newPage();
          const errors = [];
          const room = `ci-hints-v109-${Date.now()}`;

          page.on("pageerror", error => errors.push(`pageerror: ${error.message}`));
          page.on("console", message => {
            const text = message.text();
            if (message.type() === "error" && !text.startsWith("Failed to load resource:")) errors.push(`console: ${text}`);
          });
          await page.addInitScript(roomId => {
            localStorage.setItem(`pal-breeding-current-user:${roomId}`, "福冨");
            localStorage.setItem("palBoardRecorder", "福冨");
          }, room);
          await page.goto(`${baseUrl}#room=${room}`, { waitUntil: "domcontentloaded", timeout: 60000 });
          await page.waitForFunction(() => document.querySelector("#app")?.dataset.ready === "true", null, { timeout: 60000 });
          await page.waitForFunction(() => document.querySelector("#bootScreen")?.classList.contains("is-hidden"), null, { timeout: 10000 });
          await page.evaluate(() => document.querySelectorAll("dialog[open]").forEach(dialog => dialog.close()));

          const audit = await page.evaluate(() => {
            const current = window.eval("state");
            const maxLength = Math.max(...current.pals.map(pal => romajiConsonantHint(pal.name).length));
            const slotCount = romajiHintSlotCount();
            const emptyNames = current.pals.filter(pal => romajiConsonantHint(pal.name).length === 0).map(pal => pal.name);
            const panel = document.createElement("div");
            panel.innerHTML = romajiHintPanel("ムラクモ", [`slot-0`, `slot-${slotCount - 1}`], "forward");
            const buttons = Array.from(panel.querySelectorAll(".hint-position"));
            return {
              murakumo: romajiConsonantHint("ムラクモ").join(""),
              frostallionJa: romajiConsonantHint("グレイシャル").join(""),
              smallKana: romajiConsonantHint("ニャット").join(""),
              vowelOnly: romajiConsonantHint("アヌビス").join(""),
              longMark: romajiConsonantHint("モー").join(""),
              slotCount,
              maxLength,
              emptyNames,
              firstValue: buttons[0]?.querySelector("strong")?.textContent || "",
              lastValue: buttons.at(-1)?.querySelector("strong")?.textContent || "",
              lastMissing: buttons.at(-1)?.classList.contains("is-missing") || false,
            };
          });

          if (audit.murakumo !== "MRKM") throw new Error(`ムラクモの子音が不正です: ${JSON.stringify(audit)}`);
          if (audit.frostallionJa !== "GRISYR") throw new Error(`グレイシャルの子音が不正です: ${JSON.stringify(audit)}`);
          if (audit.smallKana !== "NYTT") throw new Error(`小さいゃ・っの処理が不正です: ${JSON.stringify(audit)}`);
          if (audit.vowelOnly !== "ANBS") throw new Error(`母音だけの文字が保持されていません: ${JSON.stringify(audit)}`);
          if (audit.longMark !== "Mー") throw new Error(`伸ばし棒が保持されていません: ${JSON.stringify(audit)}`);
          if (audit.slotCount !== Math.max(7, audit.maxLength)) throw new Error(`全候補の枠数が最長名基準ではありません: ${JSON.stringify(audit)}`);
          if (audit.emptyNames.length) throw new Error(`ローマ字ヒントを作れないパルがあります: ${audit.emptyNames.join(", ")}`);
          if (audit.firstValue !== "M" || audit.lastValue !== "×" || !audit.lastMissing) throw new Error(`開示済み文字または赤い×の状態が不正です: ${JSON.stringify(audit)}`);

          const seeded = await page.evaluate(() => {
            const current = window.eval("state");
            let selected = null;
            for (const combo of current.matrix.values()) {
              const a = getPal(combo.a), b = getPal(combo.b), child = getPal(combo.childId);
              if (a && b && child && a.id !== b.id) { selected = { a, b, child }; break; }
            }
            if (!selected) throw new Error("ヒント用の配合を取得できません");
            current.records = [];
            current.guideUnlocked = true;
            current.hintMode = "forward";
            current.pickerValues.hintParentA = selected.a.id;
            current.pickerValues.hintParentB = selected.b.id;
            resetHintProgress();
            switchView("hints");
            return { aId: selected.a.id, bId: selected.b.id };
          });

          const romajiButtons = page.locator('#hintBoard [data-forward-position^="romaji|"]');
          if (await romajiButtons.count() !== audit.slotCount) throw new Error("画面上のローマ字子音枠数が統一されていません");
          await romajiButtons.first().click();
          if (await page.locator('#hintBoard [data-forward-position^="romaji|"].is-revealed').count() !== 1) throw new Error("ローマ字子音を位置単位で開示できません");

          await page.click('[data-forward-plan]');
          if (!(await page.locator('#recordDialog').evaluate(dialog => dialog.open))) throw new Error("試す予定の登録画面が開きません");
          const planned = await page.evaluate(() => {
            const current = window.eval("state");
            return {
              parentA: current.pickerValues.recordParentA,
              parentB: current.pickerValues.recordParentB,
              result: current.pickerValues.recordResult,
            };
          });
          if (planned.parentA !== seeded.aId || planned.parentB !== seeded.bId || planned.result) throw new Error(`試す予定への引き継ぎが不正です: ${JSON.stringify(planned)}`);
          await page.evaluate(() => document.querySelector('#recordDialog')?.close());

          await page.evaluate(() => {
            const current = window.eval("state");
            const a = getPal(current.pickerValues.hintParentA), b = getPal(current.pickerValues.hintParentB);
            current.records = [normalizeRecord({
              id: "ci-v109-pending",
              parentA: a.name,
              parentB: b.name,
              resultPal: "",
              eggType: "",
              mutation: false,
              recorder: current.currentUser,
              note: "hint trial",
              favorites: {},
              updatedAt: Date.now(),
            }, "ci-v109-pending")];
            renderHints();
          });
          if (await page.locator('[data-forward-plan]').count()) throw new Error("登録済み親ペアに試す予定ボタンが重複表示されています");
          if (await page.locator('[data-hint-edit-record]').count() < 1) throw new Error("確認中の既存記録を開く導線がありません");

          if (errors.length) throw new Error(`Browser errors: ${errors.join(" | ")}`);
          await context.close();
          await browser.close();
          console.log("Hint smoke tests passed: romaji consonants, dynamic slots, red ×, and discovery trial planning.");
          '''
          Path('scripts/smoke-hints.mjs').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in smoke.splitlines()) + '\n', encoding='utf-8')

          smoke_browser_path = Path('scripts/smoke-browser.mjs')
          smoke_browser = smoke_browser_path.read_text(encoding='utf-8')
          smoke_browser = replace_once(
              smoke_browser,
              '''  if (await page.locator('#hintBoard [data-forward-position^="english|"]').count() !== 7) throw new Error("English hint does not have seven fixed positions");''',
              '''  const forwardRomajiSlots = await page.evaluate(() => romajiHintSlotCount());
              if (await page.locator('#hintBoard [data-forward-position^="romaji|"]').count() !== forwardRomajiSlots) throw new Error("Romaji consonant hint does not use the global longest-name slot count");''',
              'forward romaji slot test',
          )
          smoke_browser = replace_once(smoke_browser, "  await page.click('[data-forward-position=\"english|last\"]');", "  await page.click('[data-forward-position=\"romaji|slot-0\"]');", 'forward romaji click')
          smoke_browser = replace_once(smoke_browser, "  await page.click('[data-forward-position=\"japanese|middle\"]');", "  await page.locator('[data-forward-position^=\"japanese|\"]:not(:disabled)').first().click();", 'forward japanese click')
          smoke_browser = replace_once(
              smoke_browser,
              '''  if (await firstReverse.locator('[data-reverse-position*="|english|"]').count() !== 7) throw new Error("Reverse English hint does not keep a fixed seven-position layout");''',
              '''  const reverseRomajiSlots = await page.evaluate(() => romajiHintSlotCount());
              if (await firstReverse.locator('[data-reverse-position*="|romaji|"]').count() !== reverseRomajiSlots) throw new Error("Reverse Romaji hint does not use the global longest-name slot count");''',
              'reverse romaji slot test',
          )
          smoke_browser = replace_once(smoke_browser, "  await firstReverse.locator('[data-reverse-position$=\"|english|first\"]').click();", "  await firstReverse.locator('[data-reverse-position*=\"|romaji|\"]:not(:disabled)').first().click();", 'reverse romaji click')
          smoke_browser = replace_once(smoke_browser, "  await firstReverse.locator('[data-reverse-position$=\"|japanese|last\"]').click();", "  await firstReverse.locator('[data-reverse-position*=\"|japanese|\"]:not(:disabled)').first().click();", 'reverse japanese click')
          smoke_browser = smoke_browser.replace('Forward hint page uses fixed position choices instead of revealing name length.', 'Forward hint page uses a global fixed slot count instead of revealing each name length.')
          smoke_browser_path.write_text(smoke_browser, encoding='utf-8')

          validate_path = Path('.github/workflows/validate.yml')
          validate = validate_path.read_text(encoding='utf-8')
          validate = validate.replace('          node --check hint-v108.js\n', '')
          validate = validate.replace('          node --check scripts/smoke-v108-hint.mjs', '          node --check scripts/smoke-hints.mjs')
          validate = validate.replace("          assert 'hint-v108.js' in refs, 'v108 hint correction is not loaded'\n", "          assert 'hint-v108.js' not in refs, 'Legacy hint correction is still loaded'\n")
          validate = validate.replace("          assert 'style-discovery-v105.css' in refs, 'Discovery styles are not loaded'", "          assert 'style-discovery.css' in refs, 'Discovery styles are not loaded'")
          validate = validate.replace("          assert '?v=108' in html, 'v108 cache busting is missing'", "          assert '?v=109' in html, 'v109 cache busting is missing'")
          validate = validate.replace("for path in ['style-foundation.css','style-components.css','style-responsive.css','style-discovery-v105.css']:", "for path in ['style-foundation.css','style-components.css','style-responsive.css','style-discovery.css']:")
          validate = validate.replace('          node scripts/smoke-v108-hint.mjs', '          node scripts/smoke-hints.mjs')
          validate = validate.replace('Wait for GitHub Pages v108 deployment', 'Wait for GitHub Pages v109 deployment')
          validate = validate.replace("grep -q 'hint-v108.js?v=108'", "grep -q 'app-discovery.js?v=109'")
          validate = validate.replace('GitHub Pages did not publish v108 within the expected time.', 'GitHub Pages did not publish v109 within the expected time.')
          validate_path.write_text(validate, encoding='utf-8')

          readme_path = Path('README.md')
          if readme_path.exists():
            readme = readme_path.read_text(encoding='utf-8')
            note = '''\n## v109 配合ヒントと発見フロー\n\n- 英語名ヒントを、日本語名のローマ字子音を1文字ずつ開く方式へ変更\n- 全パルで最も長い子音表記に合わせてヒント枠数を統一\n- 名前が続かない位置はクリック後に赤い「×」を表示\n- ヒントから結果を明かさず、親ペアだけを「確認中」の配合記録として追加可能\n- 親の入れ替えでは開示済みヒントを維持し、別の組み合わせへ変更した場合だけリセット\n'''
            if '## v109 配合ヒントと発見フロー' not in readme:
              readme_path.write_text(readme.rstrip() + '\n' + note, encoding='utf-8')

          for temporary in [
              '.github/request-v109-research.txt',
              '.github/request-v109-ready.txt',
              '.github/.v109-note',
              '.github/.v109-stop',
              '.github/.v109-orchestration',
              '.github/.v109-placeholder',
              '.github/.v109-final-placeholder',
              '.github/workflows/apply-v109.yml',
          ]:
            Path(temporary).unlink(missing_ok=True)
          PY

      - name: Validate generated changes
        run: |
          node --check app-discovery.js
          node --check app-actions.js
          node --check scripts/smoke-browser.mjs
          node --check scripts/smoke-hints.mjs
          test ! -e hint-v108.js
          test ! -e style-discovery-v105.css
          grep -q 'app-discovery.js?v=109' index.html
          grep -q 'style-discovery.css?v=109' index.html

      - name: Commit v109
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace English hints with romaji consonants v109"
          git push origin HEAD:main
