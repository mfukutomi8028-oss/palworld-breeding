name: Fix v107 placeholder asset reference

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[fix-v107-placeholder]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-discovery-picker-egg-paldex-v107
          fetch-depth: 0
      - name: Replace obsolete PNG placeholder reference
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('app-core.js')
          text=path.read_text(encoding='utf-8')
          old='const UNKNOWN_PAL_ICON = "assets/unknown-pal-v8.png";'
          new='const UNKNOWN_PAL_ICON = "assets/unknown-pal-v8.svg";'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one obsolete placeholder reference, got {text.count(old)}')
          path.write_text(text.replace(old,new),encoding='utf-8')
          PY
          node --check app-core.js
      - name: Commit placeholder correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-core.js
          git commit -m "Use the existing SVG unknown Pal placeholder"
          git push origin HEAD:fix-discovery-picker-egg-paldex-v107
