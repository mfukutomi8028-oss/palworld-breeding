name: Build and Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ !contains(github.event.head_commit.message, '[resume-v110-config]') }}
    runs-on: ubuntu-latest
    outputs:
      generated: ${{ steps.commit.outputs.generated }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect completed and incomplete v110 artifacts
        id: state
        run: |
          data_ready=false
          ui_ready=false
          if [ -s data/pal-stats-v1.json ] && [ -s data/pals-v1.json ]; then
            data_ready=true
          fi
          if grep -q '?v=110' index.html && grep -q 'palSiteVersion = "110"' config.js; then
            ui_ready=true
          fi
          echo "data_ready=${data_ready}" >> "$GITHUB_OUTPUT"
          echo "ui_ready=${ui_ready}" >> "$GITHUB_OUTPUT"
          echo "Fixed data ready: ${data_ready}"
          echo "v110 UI ready: ${ui_ready}"

      - name: Install PalDB snapshot parser only when fixed data is absent
        if: steps.state.outputs.data_ready != 'true'
        run: python -m pip install --disable-pip-version-check beautifulsoup4==4.13.4

      - name: Generate fixed PalDB data only when no verified snapshot exists
        if: steps.state.outputs.data_ready != 'true'
        run: python scripts/build-paldb-stats.py --update-pals

      - name: Integrate the existing fixed data into the Paldex only when needed
        if: steps.state.outputs.ui_ready != 'true'
        run: python scripts/apply-paldex-stats-v110.py

      - name: Validate resumed v110 artifacts before committing
        if: steps.state.outputs.data_ready != 'true' || steps.state.outputs.ui_ready != 'true'
        run: |
          node scripts/validate-pal-stats-v110.mjs
          node --check app-core.js
          node --check app-data.js
          node --check app-explore.js
          node --check app-actions.js
          grep -q '?v=110' index.html
          grep -q 'palSiteVersion = "110"' config.js

      - name: Commit only missing v110 artifacts
        id: commit
        if: steps.state.outputs.data_ready != 'true' || steps.state.outputs.ui_ready != 'true'
        run: |
          if git diff --quiet; then
            echo 'generated=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/pals-v1.json data/pal-stats-v1.json data/SOURCES.md \
            app-core.js app-data.js app-explore.js app-actions.js ui-shell.js \
            style-components.css style-responsive.css index.html config.js
          git commit -m '[pal-stats-v110] Complete verified stats and Paldex integration'
          git push origin HEAD:main
          echo 'generated=true' >> "$GITHUB_OUTPUT"

      - name: Mark already complete build
        if: steps.state.outputs.data_ready == 'true' && steps.state.outputs.ui_ready == 'true'
        run: |
          echo 'generated=false' >> "$GITHUB_OUTPUT"
          echo 'v110 fixed data and UI are already committed; proceeding to deployment.'

  deploy:
    if: needs.prepare.outputs.generated != 'true'
    needs: prepare
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure GitHub Pages uses Actions deployments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="$(curl -sS -o /tmp/pages-update.json -w '%{http_code}' -X PUT \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/json' \
            -d '{"build_type":"workflow"}' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")"
          cat /tmp/pages-update.json
          test "$status" = '204' -o "$status" = '200'

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
