name: Build and Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate the committed v118 release
        run: |
          test -s data/pal-stats-v1.json
          test -s data/pals-v1.json
          test -s data/pal-growth-v1.json
          node scripts/validate-pal-stats-v110.mjs
          node scripts/validate-pal-growth-v118.mjs
          node --check app-core.js
          node --check app-data.js
          node --check app-explore.js
          node --check app-actions.js
          node --check app-pal-details-v111.js
          node --check app-ux-v117.js
          node --check app-pal-growth.js
          grep -q '?v=118' index.html
          grep -q 'app-pal-growth.js?v=118' index.html
          grep -q 'style-pal-growth.css?v=118' index.html
          grep -q 'palSiteVersion = "118"' config.js

      - name: Ensure GitHub Pages uses Actions deployments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="$(curl -sS -o /tmp/pages-update.json -w '%{http_code}' -X PUT \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/json' \
            -d '{"build_type":"workflow"}' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")"
          cat /tmp/pages-update.json
          test "$status" = '204' -o "$status" = '200'

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published v118 files
        run: |
          base="${{ steps.deployment.outputs.page_url }}"
          base="${base%/}"
          for attempt in $(seq 1 45); do
            stamp="${GITHUB_SHA}-${attempt}-$(date +%s)"
            index="$(curl -fsSL "${base}/index.html?verify=${stamp}" || true)"
            config="$(curl -fsSL "${base}/config.js?verify=${stamp}" || true)"
            if echo "$index" | grep -q 'app-pal-growth.js?v=118' && echo "$config" | grep -q 'palSiteVersion = "118"'; then
              echo 'Published GitHub Pages is v118.'
              exit 0
            fi
            sleep 8
          done
          echo 'Published GitHub Pages did not expose v118 within the expected window.'
          exit 1
