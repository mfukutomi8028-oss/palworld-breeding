name: Build and Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate the committed release
        run: |
          test -s data/pal-stats-v1.json
          test -s data/pals-v1.json
          node scripts/validate-pal-stats-v110.mjs
          node scripts/validate-pal-details-v111.mjs
          node scripts/validate-pal-ui-v113.mjs
          node scripts/validate-site-version.mjs
          node --check app-core.js
          node --check app-data.js
          node --check app-explore.js
          node --check app-actions.js
          node --check app-ux-v118.js
          node --check app-ux-v118-work.js
          node --check app-growth-v118-data.js
          node --check app-growth-v118-ui.js

      - name: Ensure GitHub Pages uses Actions deployments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="$(curl -sS -o /tmp/pages-update.json -w '%{http_code}' -X PUT \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/json' \
            -d '{"build_type":"workflow"}' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")"
          cat /tmp/pages-update.json
          test "$status" = '204' -o "$status" = '200'

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
