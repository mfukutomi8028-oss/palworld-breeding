name: Validate GitHub Pages release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-pages-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate the committed release
        run: |
          test -s data/pal-stats-v1.json
          test -s data/pals-v1.json
          node scripts/validate-pal-stats-v110.mjs
          node scripts/validate-pal-details-v111.mjs
          node scripts/validate-pal-ui-v113.mjs
          node scripts/validate-site-version.mjs
          node --check app-core.js
          node --check app-data.js
          node --check app-explore.js
          node --check app-actions.js
          node --check app-ux-v118.js
          node --check app-ux-v118-work.js
          node --check app-growth-v118-data.js
          node --check app-growth-v118-ui.js

      - name: Confirm repository Pages source is legacy main/root
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          response="$(curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")"
          node -e '
            const pages = JSON.parse(process.argv[1]);
            if (pages.build_type !== "legacy" || pages.source?.branch !== "main" || pages.source?.path !== "/") {
              console.error("Unexpected GitHub Pages source:", pages);
              process.exit(1);
            }
            console.log("GitHub Pages source is legacy main/root; deployment is handled by GitHub Pages automatically.");
          ' "$response"
