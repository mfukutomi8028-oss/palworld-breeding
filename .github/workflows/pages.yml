name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Cancel superseded legacy Pages run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 8
          python - <<'PY' > /tmp/legacy-pages-runs.txt
          import json
          import os
          import urllib.parse
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          token = os.environ["GH_TOKEN"]
          query = urllib.parse.urlencode({"head_sha": sha, "per_page": 50})
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/actions/runs?{query}",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request) as response:
              runs = json.load(response).get("workflow_runs", [])
          for run in runs:
              if run.get("name") == "pages build and deployment" and run.get("status") in {"queued", "in_progress", "waiting", "pending"}:
                  print(run["id"])
          PY

          while read -r run_id; do
            [ -n "$run_id" ] || continue
            status="$(curl -sS -o /tmp/cancel-pages.json -w '%{http_code}' -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel")"
            echo "Legacy Pages run ${run_id}: cancel HTTP ${status}"
            if [ "$status" != "202" ] && [ "$status" != "409" ]; then
              cat /tmp/cancel-pages.json || true
              exit 1
            fi
          done < /tmp/legacy-pages-runs.txt

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
