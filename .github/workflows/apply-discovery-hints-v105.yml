# Triggered after workflow registration
name: Apply discovery and hints v105

on:
  push:
    branches: [feature-discovery-hints-v105]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[discovery-v105]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-discovery-hints-v105
          fetch-depth: 0

      - name: Integrate UI, styles, cache version and validation
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              text = Path(path).read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              Path(path).write_text(text.replace(old, new), encoding='utf-8')

          nav_marker = '''        <button class="nav__item" type="button" data-view="paldex">
          <span class="nav__icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h12a2 2 0 0 1 2 2v14H7a2 2 0 0 1-2-2V4Zm2 0v16m3-12h6m-6 4h6"/></svg></span><span>パル図鑑</span>
        </button>'''
          nav_replacement = '''        <button class="nav__item" type="button" data-view="hints">
          <span class="nav__icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6m-5 3h4M8.5 14.5C7.6 13.7 7 12.5 7 11a5 5 0 0 1 10 0c0 1.5-.6 2.7-1.5 3.5-.8.8-1.2 1.4-1.3 2.5h-4.4c-.1-1.1-.5-1.7-1.3-2.5Z"/></svg></span><span>配合ヒント</span>
        </button>
''' + nav_marker
          replace_once('ui-shell.js', nav_marker, nav_replacement)

          paldex_marker = '''      <section class="view" id="view-paldex" data-view-panel="paldex">'''
          hints_view = '''      <section class="view" id="view-hints" data-view-panel="hints">
        <section class="panel hint-builder-card">
          <div class="section-heading"><div><span class="section-kicker">PARENTS → HINTS</span><h2>答えを見ずに配合結果を推理</h2><p>発見済みの親パルを選び、属性・図鑑番号・英語名・日本語名を少しずつめくります。</p></div><button class="button button--ghost" id="hintReset" type="button">選択をリセット</button></div>
          <div class="hint-parent-builder">
            <div class="pal-select-shell" data-picker-shell="hintParentA"><label>親A</label><button class="pal-select-button" type="button" data-open-picker="hintParentA"><span class="pal-select-button__placeholder">発見済みパルを選択</span></button></div>
            <button class="swap-button" id="hintSwapParents" type="button" aria-label="親Aと親Bを入れ替える"><svg viewBox="0 0 24 24"><path d="m7 7 3-3 3 3M10 4v13m7 0-3 3-3-3m3 3V7"/></svg></button>
            <div class="pal-select-shell" data-picker-shell="hintParentB"><label>親B</label><button class="pal-select-button" type="button" data-open-picker="hintParentB"><span class="pal-select-button__placeholder">発見済みパルを選択</span></button></div>
          </div>
        </section>
        <section class="panel hint-board" id="hintBoard"></section>
      </section>

''' + paldex_marker
          replace_once('ui-shell.js', paldex_marker, hints_view)

          settings_marker = '''<button class="button button--danger" id="clearLocalCache" type="button">データキャッシュを再取得</button></div></section>'''
          settings_replacement = '''<button class="button button--danger" id="clearLocalCache" type="button">データキャッシュを再取得</button></div><button class="guide-secret-button" id="guideModeToggle" type="button" aria-label="全パル表示モードを切り替える" aria-pressed="false"><span class="visually-hidden">全パル表示モード</span></button></section>'''
          replace_once('ui-shell.js', settings_marker, settings_replacement)

          component_css = Path('style-components.css')
          component_css.write_text(component_css.read_text(encoding='utf-8') + '''
.visually-hidden{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
.mystery-result{display:grid;gap:7px;width:100%;padding:11px 13px;text-align:left}.mystery-result strong{font-size:13px}.mystery-result span{color:var(--muted);font-size:10px;line-height:1.55}.mystery-result .button{justify-self:start;min-height:34px;padding:6px 10px;font-size:10px}
.paldex-empty{grid-column:1/-1}
.hint-builder-card{padding:22px;margin-bottom:14px}.hint-parent-builder{display:grid;grid-template-columns:minmax(220px,1fr) 48px minmax(220px,1fr);gap:12px;align-items:end}.hint-board{min-height:430px;padding:24px}.hint-empty{display:grid;place-items:center;align-content:center;min-height:370px;text-align:center}.hint-empty img{width:82px;height:82px;object-fit:contain;margin-bottom:14px}.hint-empty h3{margin:0 0 8px;font-size:22px}.hint-empty p{max-width:560px;margin:0;color:var(--text-soft);line-height:1.7}.hint-discovered,.hint-mystery{display:grid;gap:20px}.hint-discovered{text-align:center}.hint-recipe{display:grid;grid-template-columns:minmax(0,1fr) 28px minmax(0,1fr) 28px minmax(0,1fr);gap:10px;align-items:center}.hint-recipe>span{color:var(--muted);text-align:center;font-size:20px}.hint-recipe .pal-chip{padding:12px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.025)}.hint-result-visual{display:grid;place-items:center;min-height:92px;border:1px dashed var(--line-strong);border-radius:16px;background:rgba(255,255,255,.02)}.hint-result-question{display:grid;place-items:center;width:64px;height:64px;border:2px solid var(--accent);border-radius:50%;color:var(--accent);font-size:32px;font-weight:900}.hint-result-image{width:84px;height:84px;object-fit:contain}.hint-result-image--silhouette{filter:brightness(0) saturate(100%) drop-shadow(0 8px 12px rgba(0,0,0,.4));opacity:.9}.hint-steps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.hint-step{display:grid;gap:6px;min-height:84px;padding:13px;color:var(--text);border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.025);text-align:left}.hint-step:hover{border-color:var(--line-strong);background:rgba(80,211,165,.045)}.hint-step span{color:var(--muted);font-size:10px;font-weight:900}.hint-step strong{font-size:15px;letter-spacing:.08em}.hint-step.is-disabled{cursor:default;opacity:.8}.hint-final{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-top:16px;border-top:1px solid var(--line)}.hint-final p{flex:1;min-width:240px;margin:0;color:var(--muted);font-size:11px}.hint-answer{flex-basis:100%;padding:14px;border:1px solid rgba(80,211,165,.2);border-radius:16px;background:rgba(80,211,165,.06)}
.settings-card--wide{position:relative}.guide-secret-button{position:absolute;right:11px;bottom:11px;width:12px;height:12px;padding:0;border:0;border-radius:50%;background:var(--muted);opacity:.08;transition:.18s}.guide-secret-button:hover,.guide-secret-button:focus-visible{opacity:.55;box-shadow:0 0 0 5px rgba(80,211,165,.08)}.guide-secret-button.is-active{background:var(--accent);opacity:.42;box-shadow:0 0 10px rgba(80,211,165,.35)}
#view-favorites>.panel{padding:24px 28px 28px}#view-favorites .section-heading{padding-inline:2px}#favoriteList{overflow:hidden;border:1px solid var(--line);border-radius:18px;background:rgba(3,17,22,.18)}#favoriteList .record-row{padding-left:20px;padding-right:26px}
''', encoding='utf-8')

          responsive_css = Path('style-responsive.css')
          responsive_css.write_text(responsive_css.read_text(encoding='utf-8') + '''
@media(max-width:980px){.hint-recipe{grid-template-columns:minmax(0,1fr) 22px minmax(0,1fr) 22px minmax(0,1fr)}#view-favorites>.panel{padding:20px}}
@media(max-width:680px){.hint-builder-card,.hint-board{padding:15px}.hint-parent-builder{grid-template-columns:1fr}.hint-parent-builder .swap-button{justify-self:center;transform:rotate(90deg)}.hint-recipe{grid-template-columns:1fr}.hint-recipe>span{transform:rotate(90deg)}.hint-steps{grid-template-columns:1fr}.hint-final{align-items:stretch}.hint-final .button{width:100%}#view-favorites>.panel{padding:14px}#favoriteList .record-row{padding-left:12px;padding-right:14px}}
''', encoding='utf-8')

          index = Path('index.html')
          index_text = index.read_text(encoding='utf-8').replace('?v=104','?v=105')
          marker = '  <script src="app-records.js?v=105" defer></script>\n'
          if marker not in index_text:
              raise SystemExit('index script marker not found')
          index_text = index_text.replace(marker, marker + '  <script src="app-discovery.js?v=105" defer></script>\n', 1)
          index.write_text(index_text, encoding='utf-8')

          config = Path('config.js')
          config_text = config.read_text(encoding='utf-8')
          if 'window.palSiteVersion = "104";' not in config_text:
              raise SystemExit('config v104 not found')
          config.write_text(config_text.replace('window.palSiteVersion = "104";','window.palSiteVersion = "105";'), encoding='utf-8')

          validate = Path('.github/workflows/validate.yml')
          validate_text = validate.read_text(encoding='utf-8')
          validate_text = validate_text.replace('node --check app-records.js\n','node --check app-records.js\n          node --check app-discovery.js\n',1)
          validate_text = validate_text.replace("assert '?v=104' in html, 'v104 cache busting is missing'", "assert '?v=105' in html, 'v105 cache busting is missing'")
          validate_text = validate_text.replace("app-data.js?v=104", "app-data.js?v=105")
          validate_text = validate_text.replace("v104 deployment", "v105 deployment").replace("publish v104", "publish v105")
          validate.write_text(validate_text, encoding='utf-8')
          PY

      - name: Validate integration
        run: |
          node --check app-discovery.js
          node --check app-explore.js
          node --check app-actions.js
          grep -q 'data-view="hints"' ui-shell.js
          grep -q 'id="guideModeToggle"' ui-shell.js
          grep -q 'app-discovery.js?v=105' index.html
          grep -q 'window.palSiteVersion = "105"' config.js

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui-shell.js style-components.css style-responsive.css index.html config.js .github/workflows/validate.yml
          git commit -m "[discovery-v105] Integrate discovery UI and hint workspace"
          git push origin HEAD:feature-discovery-hints-v105
