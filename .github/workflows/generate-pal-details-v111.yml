name: Generate fixed PalDB details v111

on:
  push:
    branches: [feature/pal-details-v111]
    paths:
      - .github/workflows/generate-pal-details-v111.yml
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    if: github.event_name == 'push' || github.head_ref == 'feature/pal-details-v111'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Install fixed parser dependencies
        run: python -m pip install --disable-pip-version-check beautifulsoup4==4.13.4

      - name: Apply final data parser cleanup
        run: python scripts/apply-paldb-finalize-v111.py

      - name: Build Japanese PalDB detail snapshot
        run: python scripts/build-paldb-details-v111.py --workers 4

      - name: Validate generated snapshot and runtime
        run: |
          node --check app-pal-details-v111.js
          node --check scripts/validate-pal-details-v111.mjs
          node scripts/validate-pal-details-v111.mjs

      - name: Commit generated fixed data and parser
        run: |
          if git diff --quiet -- data/pal-details-v1.json scripts/build-paldb-details-v111.py; then
            echo 'No generated detail or parser changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/pal-details-v1.json scripts/build-paldb-details-v111.py
          git commit -m '[pal-details-v111-data] Finalize fixed details and drop parsing'
          git push origin HEAD:${TARGET_BRANCH}
