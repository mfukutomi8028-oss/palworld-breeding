name: Verify v104 picker on published Pages once

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  verify:
    if: contains(github.event.head_commit.message, '[verify-picker-v104]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install browser runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Wait for GitHub Pages v104
        run: |
          URL="https://mfukutomi8028-oss.github.io/palworld-breeding/index.html"
          for attempt in $(seq 1 40); do
            if curl -fsS "$URL" | grep -q 'app-actions.js?v=104'; then
              echo "v104 is published."
              exit 0
            fi
            sleep 10
          done
          echo "v104 was not published within the expected time."
          exit 1

      - name: Test published GitHub Pages
        env:
          APP_URL: https://mfukutomi8028-oss.github.io/palworld-breeding/
        run: node scripts/smoke-browser.mjs

      - name: Record result on PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$RESULT" = "success" ]; then
            gh pr comment 12 --body "✅ GitHub Pages v104 verification succeeded for commit ${GITHUB_SHA}. Chromium confirmed that the parent picker renders all 299 Pals, includes entries after No.121, and allows selection of the final Pal. Existing data, image outage, and mobile tests also passed. Run: ${RUN_URL}"
          else
            gh pr comment 12 --body "❌ GitHub Pages v104 verification failed for commit ${GITHUB_SHA}. Review the workflow log before reporting completion. Run: ${RUN_URL}"
          fi
