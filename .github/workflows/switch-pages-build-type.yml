name: Switch Pages to workflow publishing

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read
  pages: write

jobs:
  switch:
    runs-on: ubuntu-latest
    steps:
      - name: Change Pages build type to workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -d '{"build_type":"workflow"}' > /tmp/update.json
          cat /tmp/update.json
          echo
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" > /tmp/pages.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/pages.json',encoding='utf-8'))
          print(json.dumps({'build_type':data.get('build_type'),'source':data.get('source'),'status':data.get('status')},ensure_ascii=False,indent=2))
          if data.get('build_type') != 'workflow':
              raise SystemExit('Pages build_type was not changed to workflow')
          PY
