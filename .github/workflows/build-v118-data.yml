name: Build v118 Pal growth data

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-paldex-growth-v118
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4
      - name: Repair active-skill parser
        run: python scripts/repair-pal-growth-parser-v118.py
      - name: Build fixed PalDB growth snapshot
        run: python scripts/build-pal-growth-v118.py
      - name: Validate representative PalDB values
        run: |
          python - <<'PY'
          import json
          data=json.load(open('data/pal-growth-v1.json',encoding='utf-8'))
          assert data['count']==299
          assert data['partnerStarCoverage']==299
          assert data['activeSkillCoverage']>=295, data['activeSkillCoverage']
          rows={r['enName']:r for r in data['records']}
          lamball=rows['Lamball']
          bylv={s['level']:s for s in lamball['activeSkills']}
          assert bylv[40]['name']=='パワーボム', bylv.get(40)
          assert bylv[40]['ct']==8 and bylv[40]['power']==120, bylv[40]
          assert bylv[50]['power']==450 and bylv[70]['power']==700
          men=rows['Menasting']
          assert len(men['partnerSkill']['stars'])==5
          star0=' '.join(men['partnerSkill']['stars'][0]['effects'])
          star4=' '.join(men['partnerSkill']['stars'][4]['effects'])
          assert '40' in star0 and '5' in star0, star0
          assert '80' in star4 and '10' in star4, star4
          men40={s['level']:s for s in men['activeSkills']}[40]
          assert men40['name']=='ロックランス' and men40['ct']==20 and men40['power']==400, men40
          print('Coverage',data['partnerStarCoverage'],data['activeSkillCoverage'])
          print('Lamball Lv40',bylv[40])
          print('Menasting ★0',star0)
          print('Menasting ★4',star4)
          PY
      - name: Commit repaired builder and fixed snapshot safely
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/build-pal-growth-v118.py data/pal-growth-v1.json
          if git diff --cached --quiet; then
            echo 'Snapshot already current.'
            exit 0
          fi
          git commit -m '[v118-data] Add validated PalDB growth snapshot'
          git fetch origin feature-paldex-growth-v118
          git rebase origin/feature-paldex-growth-v118
          git push origin HEAD:feature-paldex-growth-v118
