name: Vendor Palworld v103 data

on:
  push:
    branches: [fix-data-recovery-v103]

permissions:
  contents: write

jobs:
  vendor:
    if: ${{ !contains(github.event.head_commit.message, '[vendor-data]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-data-recovery-v103
          fetch-depth: 0
      - name: Download fixed source data and images
        run: |
          set -euo pipefail
          PAL_COMMIT="bbe68288a4404ea22467d53b73aee15a70abaa97"
          LOC_COMMIT="f45a48ef25ce08a5311a27e55b17062ba0bb4362"
          ENGINE_COMMIT="979258dfb579f1c5d068d41be0f5dd7297b401a8"
          mkdir -p data assets/pals
          curl -fsSL "https://raw.githubusercontent.com/bowenchen-1/palworld-guide/${PAL_COMMIT}/data/sources/paldb-1.0-20260715.json" -o data/pals-v1.json
          curl -fsSL "https://raw.githubusercontent.com/bowenchen-1/palworld-guide/${PAL_COMMIT}/data/sources/palworld-icon-manifest.json" -o data/pal-images-v1.json
          curl -fsSL "https://raw.githubusercontent.com/zaigie/palworld-server-tool/${LOC_COMMIT}/web/src/assets/pal.json" -o data/pal-localization-ja-v1.json
          curl -fsSL "https://raw.githubusercontent.com/palcalc-tools/palworld-1.0-calculator/${ENGINE_COMMIT}/index.html" -o /tmp/palcalc.html
          node <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('/tmp/palcalc.html', 'utf8');
          const marker = 'const DATA = ';
          const start = text.indexOf(marker);
          const jsonStart = start + marker.length;
          const jsonEnd = text.indexOf(';\nconst ', jsonStart);
          if (start < 0 || jsonEnd < 0) throw new Error('PalCalc DATA block not found');
          const data = JSON.parse(text.slice(jsonStart, jsonEnd));
          fs.writeFileSync('data/breeding-v1.json', JSON.stringify(data));
          NODE
          rm -rf /tmp/palworld-guide
          git init -q /tmp/palworld-guide
          git -C /tmp/palworld-guide remote add origin https://github.com/bowenchen-1/palworld-guide.git
          git -C /tmp/palworld-guide fetch -q --depth 1 origin "${PAL_COMMIT}"
          git -C /tmp/palworld-guide checkout -q FETCH_HEAD
          rm -rf assets/pals/*
          cp -R /tmp/palworld-guide/public/icons/palworld/partner-skills/. assets/pals/
          cat > data/SOURCES.md <<EOF
          # Palworld 1.0 vendored data

          - Pal master and image manifest: bowenchen-1/palworld-guide @ ${PAL_COMMIT}
          - Japanese localization: zaigie/palworld-server-tool @ ${LOC_COMMIT}
          - Breeding engine: palcalc-tools/palworld-1.0-calculator @ ${ENGINE_COMMIT}
          - Imported: 2026-08-05
          - Game target: Palworld 1.0
          EOF
      - name: Commit vendored data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data assets/pals
          if git diff --cached --quiet; then
            echo "Vendored data is already current."
            exit 0
          fi
          git commit -m "[vendor-data] Add local Palworld 1.0 data and images"
          git push origin HEAD:fix-data-recovery-v103
