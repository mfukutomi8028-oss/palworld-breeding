name: Probe v118 PalDB HTML

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4
      - name: Print Lamball PalDB heading structure
        run: |
          python - <<'PY'
          import re, urllib.request
          from bs4 import BeautifulSoup
          url='https://paldb.cc/ja/Lamball'
          req=urllib.request.Request(url,headers={'User-Agent':'pal-breeding-note/1.0','Accept-Language':'ja'})
          html=urllib.request.urlopen(req,timeout=60).read().decode('utf-8','replace')
          soup=BeautifulSoup(html,'html.parser')
          print('HTML bytes',len(html))
          print('HEADINGS')
          for h in soup.find_all(re.compile(r'^h[1-6]$',re.I)):
              print(h.name,repr(' '.join(h.get_text(' ',strip=True).split())))
          print('TEXT MATCHES')
          for needle in ['Active Skills','アクティブ','Lv. 40','パワーボム','コロコロモコロン']:
              print(needle, html.find(needle), soup.get_text(' ',strip=True).find(needle))
          text=' '.join(soup.get_text(' ',strip=True).split())
          idx=text.find('パワーボム')
          print('CONTEXT',repr(text[max(0,idx-500):idx+1200]))
          print('PARENTS')
          node=soup.find(string=lambda s:s and 'パワーボム' in s)
          for i in range(8):
              if node is None: break
              node=node.parent
              print(i,node.name if node else None,repr(' '.join(node.get_text(' ',strip=True).split())[:1200]) if node else '')
          PY
