name: Probe v118 PalDB HTML

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4
      - name: Probe Partner Skill table variants
        run: |
          python scripts/repair-pal-growth-parser-v118.py
          python - <<'PY'
          import importlib.util
          from bs4 import BeautifulSoup

          spec=importlib.util.spec_from_file_location('growth','scripts/build-pal-growth-v118.py')
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          for en_name in ['Daedream','Lamball','Menasting','Lifmunk','Cattiva']:
              url=f'https://paldb.cc/ja/{en_name}'
              soup=BeautifulSoup(mod.fetch_html(url),'html.parser')
              heading=mod.find_partner_heading(soup)
              print('\n===',en_name,'===')
              print('heading',mod.heading_text(heading) if heading else None)
              table=mod.next_table_in_section(heading) if heading else None
              if table is None:
                  print('NO TABLE')
                  continue
              for index,tr in enumerate(table.find_all('tr')):
                  cells=[' '.join(cell.get_text(' ',strip=True).split()) for cell in tr.find_all(['th','td'])]
                  print('ROW',index,repr(cells))
              name,stars=mod.parse_partner_stars(soup)
              print('PARSED',name,stars)
          PY
